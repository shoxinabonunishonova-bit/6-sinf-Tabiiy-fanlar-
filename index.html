<body>
<header><h1>6-sinf • Tabiiy fanlar • 1–2-boblar</h1><small>Interaktiv simulyatsiyalar, testlar va kuzatuv kundaligi</small></header>
<div class="layout">
<aside id="chips"></aside>
<main id="app"></main>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
let cleanups=[];
function loop(fn){let on=true;(function f(){if(!on)return;fn();requestAnimationFrame(f)})();cleanups.push(()=>{on=false})}
const rnd=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- Zarrachalar dvigateli ---------- */
function particleBox(cv,getState,N=60,color="#2e8b57"){
  const ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
  const ps=[];
  for(let i=0;i<N;i++){const a=rnd(0,6.28);ps.push({x:rnd(0,W),y:rnd(0,H),vx:Math.cos(a),vy:Math.sin(a),c:i%10,r:Math.floor(i/10)})}
  loop(()=>{
    const s=getState();
    const x0=s.x0*W,y0=s.y0*H,x1=s.x1*W,y1=s.y1*H;
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle="#9bb5a5";ctx.lineWidth=2;ctx.strokeRect(x0,y0,x1-x0,y1-y0);
    if(s.fill){ctx.fillStyle=s.fill;ctx.fillRect(x0,y0,x1-x0,y1-y0)}
    const cols=10,rows=Math.ceil(N/cols);
    for(const p of ps){
      if(s.lattice){
        const tx=x0+(p.c+.5)/cols*(x1-x0),ty=y0+(p.r+.5)/rows*(y1-y0);
        p.x+=(tx-p.x)*.15+rnd(-1,1)*s.speed;p.y+=(ty-p.y)*.15+rnd(-1,1)*s.speed;
      }else{
        p.vx+=rnd(-.2,.2);p.vy+=rnd(-.2,.2);
        const m=Math.hypot(p.vx,p.vy)||1;p.vx=p.vx/m;p.vy=p.vy/m;
        p.x+=p.vx*s.speed;p.y+=p.vy*s.speed;
        if(p.x<x0){p.x=x0;p.vx=Math.abs(p.vx)}if(p.x>x1){p.x=x1;p.vx=-Math.abs(p.vx)}
        if(p.y<y0){p.y=y0;p.vy=Math.abs(p.vy)}if(p.y>y1){p.y=y1;p.vy=-Math.abs(p.vy)}
      }
      ctx.fillStyle=s.color||color;ctx.beginPath();ctx.arc(p.x,p.y,5,0,6.28);ctx.fill();
    }
  });
}

/* ---------- Simulyatsiyalar ---------- */
const SIM={};

SIM[1]=el=>{
  const items=[["🌳 Daraxt",1],["🪨 Tosh",0],["🐟 Baliq",1],["💧 Suv",0],["🌬️ Havo",0],["🐱 Mushuk",1],["🌱 Maysa",1],["🏔️ Tuproq",0],["🐝 Asalari",1],["🧊 Muz",0]];
  const sc=[["Yulduzlar va sayyoralar","Astronomiya"],["Tirik organizmlar","Biologiya"],["Harakat va energiya","Fizika"],["Moddalar va ularning tarkibi","Kimyo"],["Tog‘lar, daryolar, Yer yuzasi","Geografiya"],["Organizm va muhit munosabati","Ekologiya"]];
  const fans=["Astronomiya","Biologiya","Fizika","Kimyo","Geografiya","Ekologiya"];
  el.innerHTML=`<p><b>1-qism.</b> Obyektni tirik yoki jonsiz tabiatga ajrating.</p><div class="items">${items.map((it,i)=>`<div class="it" data-i="${i}"><span>${it[0]}</span><span><button class="b alt" data-a="1">Tirik</button><button class="b alt" data-a="0">Jonsiz</button></span></div>`).join("")}</div><p class="score" id="s1"></p>
  <p><b>2-qism.</b> Qaysi fan nimani o‘rganadi?</p>${sc.map((s,i)=>`<div class="row" style="margin:4px 0"><span>${s[0]}</span><select data-s="${i}"><option value="">— tanlang —</option>${fans.map(f=>`<option>${f}</option>`).join("")}</select></div>`).join("")}<p class="score" id="s2"></p>`;
  const ans={};
  $$(".it button",el).forEach(b=>b.onclick=()=>{const r=b.closest(".it"),i=+r.dataset.i;ans[i]=1;r.classList.remove("ok","no");r.classList.add(+b.dataset.a===items[i][1]?"ok":"no");$("#s1",el).textContent="To‘g‘ri: "+$$(".it.ok",el).length+" / "+items.length});
  $$("select",el).forEach(s=>s.onchange=()=>{const i=+s.dataset.s;s.style.background=s.value===sc[i][1]?"var(--ok)":"var(--bad)";$("#s2",el).textContent="To‘g‘ri: "+$$("select",el).filter(x=>x.value===sc[+x.dataset.s][1]).length+" / "+sc.length});
};

SIM[2]=el=>{
  const steps=["Savol qo‘yish","Taxmin (gipoteza)","Tadqiqot rejasi","Kuzatish / tekshiruv","Xulosa chiqarish"];
  let order=[],mix=shuffle(steps.map((s,i)=>i));
  const draw=()=>{
    el.innerHTML=`<p>Tadqiqot bosqichlarini <b>to‘g‘ri tartibda</b> bosing.</p><div>${mix.map(i=>`<button class="b alt" data-i="${i}" ${order.includes(i)?"disabled":""}>${steps[i]}</button>`).join("")}</div>
    <p>Sizning tartibingiz:</p><ol>${order.map((i,k)=>`<li style="color:${i===k?"#1a7a3f":"#c0392b"}">${steps[i]}</li>`).join("")}</ol>
    <div class="res ${order.length===5?(order.every((v,k)=>v===k)?"ok":"bad"):""}" >${order.length===5?(order.every((v,k)=>v===k)?"✅ To‘g‘ri! Tadqiqot savoldan boshlanadi, xulosa dalillarga asoslanadi.":"❌ Tartib noto‘g‘ri. Qayta urinib ko‘ring."):"Bosqichlarni tanlang..."}</div><button class="b" id="rs">Qayta boshlash</button>`;
    $$("button[data-i]",el).forEach(b=>b.onclick=()=>{order.push(+b.dataset.i);draw()});
    $("#rs",el).onclick=()=>{order=[];mix=shuffle(mix);draw()};
  };draw();
};

SIM[3]=el=>{
  let rows=[];
  el.innerHTML=`<p>Issiq choy (taxminan 95 °C) xona haroratida soviydi. Termometrni har 2 daqiqada o‘qing va jadvalga yozing.</p>
  <button class="b" id="m">🌡️ O‘lchash (+2 daqiqa)</button><button class="b alt" id="r">Tozalash</button>
  <table><thead><tr><th>№</th><th>Vaqt (daqiqa)</th><th>Harorat (°C)</th></tr></thead><tbody id="tb"></tbody></table>
  <canvas id="c" width="600" height="220"></canvas><div class="res" id="o">Kamida 5 ta o‘lchov yozing.</div>`;
  const c=$("#c",el),ctx=c.getContext("2d");
  const draw=()=>{
    $("#tb",el).innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.t}</td><td>${r.T}</td></tr>`).join("");
    ctx.clearRect(0,0,600,220);ctx.strokeStyle="#9bb5a5";ctx.beginPath();ctx.moveTo(40,10);ctx.lineTo(40,190);ctx.lineTo(590,190);ctx.stroke();
    ctx.fillStyle="#555";ctx.font="12px sans-serif";ctx.fillText("°C",8,18);ctx.fillText("daqiqa",540,208);
    ctx.strokeStyle="#c0392b";ctx.lineWidth=2;ctx.beginPath();
    rows.forEach((r,i)=>{const x=40+r.t/30*540,y=190-(r.T-15)/85*175;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
    rows.forEach(r=>{const x=40+r.t/30*540,y=190-(r.T-15)/85*175;ctx.fillStyle="#c0392b";ctx.beginPath();ctx.arc(x,y,4,0,6.28);ctx.fill()});
    if(rows.length>=5)$("#o",el).innerHTML="📋 <b>Xulosa:</b> harorat vaqt o‘tishi bilan pasaydi, dastlab tez, keyin sekinroq. Bu xulosa jadvaldagi dalillarga asoslanadi.";
  };
  $("#m",el).onclick=()=>{if(rows.length>=15)return;const t=rows.length*2;rows.push({t,T:Math.round(20+75*Math.exp(-t/10)+rnd(-.6,.6))});draw()};
  $("#r",el).onclick=()=>{rows=[];draw()};draw();
};

SIM[4]=el=>{
  el.innerHTML=`<p>Ikkita o‘simlik (A va B) ustida tajriba. <b>Faqat bitta sharoitni</b> o‘zgartirsangiz, taqqoslash adolatli bo‘ladi.</p>
  <div class="row"><div><b>A o‘simlik</b><br>Yorug‘lik: <select id="al"><option value="1">bor</option><option value="0">yo‘q</option></select> Suv: <select id="aw"><option value="1">yetarli</option><option value="0">kam</option></select></div>
  <div><b>B o‘simlik</b><br>Yorug‘lik: <select id="bl"><option value="1">bor</option><option value="0" selected>yo‘q</option></select> Suv: <select id="bw"><option value="1" selected>yetarli</option><option value="0">kam</option></select></div></div>
  Kun: <b id="dv">7</b><input type="range" id="d" min="0" max="14" value="7"><canvas id="c" width="600" height="260"></canvas><div class="res" id="o"></div>`;
  const ctx=$("#c",el).getContext("2d");
  const h=(l,w,d)=>d*0.9*(l?1:.2)*(w?1:.5);
  const plant=(x,hh,col,name)=>{
    ctx.fillStyle="#8d5a2b";ctx.fillRect(x-30,225,60,30);
    ctx.strokeStyle=col;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,225);ctx.lineTo(x,225-hh*14);ctx.stroke();
    for(let k=1;k<=Math.floor(hh/2);k++){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x+(k%2?16:-16),225-k*28,14,6,0,0,6.28);ctx.fill()}
    ctx.fillStyle="#333";ctx.font="14px sans-serif";ctx.fillText(name+": "+hh.toFixed(1)+" sm",x-40,20);
  };
  const upd=()=>{
    const v=id=>+$("#"+id,el).value,d=v("d");$("#dv",el).textContent=d;
    const a=h(v("al"),v("aw"),d),b=h(v("bl"),v("bw"),d);
    ctx.clearRect(0,0,600,260);plant(150,a,"#2e8b57","A");plant(450,b,"#6aa84f","B");
    const diff=(v("al")!==v("bl"))+(v("aw")!==v("bw"));
    const o=$("#o",el);
    if(diff===0){o.className="res part";o.textContent="Sharoitlar bir xil — farq yo‘q, taqqoslashga hojat yo‘q."}
    else if(diff===1){o.className="res ok";o.textContent="✅ Adolatli taqqoslash: faqat bitta sharoit farq qiladi, demak o‘sish farqi shu sharoitga bog‘liq."}
    else{o.className="res bad";o.textContent="⚠️ Ikkala sharoit ham farq qiladi — o‘sish farqi qaysi sababdan ekanini aniq aytib bo‘lmaydi."}
  };
  $$("select,input",el).forEach(x=>x.oninput=upd);upd();
};

SIM[5]=el=>{
  let mode="s";
  el.innerHTML=`<p>Modda holatini tanlang va zarrachalarni kuzating.</p><div id="bt"><button class="b" data-m="s">Qattiq</button><button class="b alt" data-m="l">Suyuq</button><button class="b alt" data-m="g">Gaz</button></div>
  <canvas id="c" width="600" height="260"></canvas><div class="res" id="o"></div>`;
  const txt={s:"Qattiq: zarrachalar zich va tartibli, asosan o‘z o‘rnida tebranadi.",l:"Suyuq: zarrachalar yaqin, lekin bir-birining yonidan siljiydi.",g:"Gaz: zarrachalar uzoq, erkin va tez harakatlanadi."};
  const set=m=>{mode=m;$$("#bt button",el).forEach(b=>b.className="b "+(b.dataset.m===m?"":"alt"));$("#o",el).textContent=txt[m]};
  $$("#bt button",el).forEach(b=>b.onclick=()=>set(b.dataset.m));set("s");
  particleBox($("#c",el),()=>({s:{x0:.3,y0:.25,x1:.7,y1:.9,lattice:1,speed:1},l:{x0:.2,y0:.55,x1:.8,y1:.95,speed:1.6,fill:"rgba(70,140,220,.15)",color:"#1f6fb2"},g:{x0:.05,y0:.05,x1:.95,y1:.95,speed:4,color:"#c0392b"}}[mode]));
};

SIM[6]=el=>{
  el.innerHTML=`<p>Suv haroratini o‘zgartiring (muz → suv → bug‘). Holat avtomatik yangilanadi.</p>Harorat: <b id="tv">-10</b> °C<input type="range" id="t" min="-20" max="130" value="-10">
  <canvas id="c" width="600" height="260"></canvas><div class="res" id="o"></div>
  <table><tr><th>Holat</th><th>Shakl</th><th>Hajm</th></tr><tr><td>Qattiq</td><td>saqlaydi</td><td>saqlaydi</td></tr><tr><td>Suyuq</td><td>idish shaklini oladi</td><td>saqlaydi</td></tr><tr><td>Gaz</td><td>yo‘q</td><td>yo‘q (bo‘shliqni to‘ldiradi)</td></tr></table>`;
  let T=-10;const inp=$("#t",el);
  const st=()=>T<=0?"s":T<100?"l":"g";
  inp.oninput=()=>{T=+inp.value;$("#tv",el).textContent=T;const s=st();$("#o",el).textContent=s==="s"?"🧊 Qattiq (muz): shakl va hajmni saqlaydi.":s==="l"?"💧 Suyuq (suv): hajmini saqlaydi, idish shaklini oladi.":"♨️ Gaz (bug‘): bo‘shliqni to‘ldiradi."};inp.oninput();
  particleBox($("#c",el),()=>{const s=st();return s==="s"?{x0:.35,y0:.4,x1:.65,y1:.85,lattice:1,speed:.8,fill:"rgba(160,210,240,.4)",color:"#4a90c2"}:s==="l"?{x0:.15,y0:.55,x1:.85,y1:.95,speed:1.6,fill:"rgba(70,140,220,.15)",color:"#1f6fb2"}:{x0:.05,y0:.05,x1:.95,y1:.95,speed:4,color:"#c0392b"}});
};

SIM[7]=el=>{
  el.innerHTML=`<p>Shpritsdagi gaz: porshenni bosing (hajmni kamaytiring) — zarrachalar zichlashadi, bosim ortadi.</p>Hajm: <b id="vv">100</b> %<input type="range" id="v" min="25" max="100" value="100">
  <canvas id="c" width="600" height="220"></canvas><div>Bosim (shartli): <b id="pv"></b></div><div class="res" id="o"></div>`;
  let V=100;const inp=$("#v",el);
  inp.oninput=()=>{V=+inp.value;$("#vv",el).textContent=V;$("#pv",el).textContent=(100/V).toFixed(1)+"×";$("#o",el).textContent=V<100?"Gaz siqildi: zarrachalar orasidagi masofa kamaydi, ammo gaz yo‘qolmadi.":"Gaz butun hajmni egallagan."};inp.oninput();
  particleBox($("#c",el),()=>({x0:.05,y0:.15,x1:.05+.9*V/100,y1:.85,speed:3.5,color:"#c0392b",fill:"rgba(200,60,60,.06)"}),40);
};

SIM[8]=el=>{
  el.innerHTML=`<p>Bir xil miqdordagi suvni turli idishlarga quying. Hajm o‘zgarmaydi, shakl esa idishga moslashadi.</p>Suv hajmi: <b id="vv">200</b> ml<input type="range" id="v" min="50" max="250" step="10" value="200">
  <canvas id="c" width="600" height="260"></canvas><div class="res">Suyuqlik idish shaklini oladi, lekin hajmini saqlaydi.</div>`;
  const ctx=$("#c",el).getContext("2d");
  const cont=[{n:"Stakan",w:80,H:200},{n:"Piyola",w:140,H:120},{n:"Keng idish",w:200,H:80}];

    const V=+$("#v",el).value;$("#vv",el).textContent=V;ctx.clearRect(0,0,600,260);
    cont.forEach((c,i)=>{
      const cx=100+i*200,x=cx-c.w/2,y=230-c.H,hh=Math.min(c.H,V/250*c.H*(80/c.w)*1.6);

    });

SIM[9]=el=>{
  el.innerHTML=`<p>Sovuq va iliq suvga bo‘yoq tomizildi. Zarrachalar tarqalishini taqqoslang (soddalashtirilgan model).</p><button class="b" id="r">▶ Qayta boshlash</button>
  <div class="row"><div><b>❄️ Sovuq suv</b><canvas id="c1" width="300" height="220"></canvas><div id="p1"></div></div><div><b>🔥 Iliq suv</b><canvas id="c2" width="300" height="220"></canvas><div id="p2"></div></div></div>
  <div class="res">Harorat yuqori bo‘lsa, zarrachalar tezroq harakatlanadi va diffuziya tezlashadi.</div>`;
  const mk=(id,pid,step)=>{
    const cv=$(id,el),ctx=cv.getContext("2d");let ps;
    const init=()=>{ps=Array.from({length:80},()=>({x:rnd(130,170),y:rnd(100,120)}))};init();
    cv._init=init;
    loop(()=>{
      ctx.fillStyle="rgba(190,225,250,.35)";ctx.fillRect(0,0,300,220);ctx.clearRect(0,0,300,220);ctx.fillStyle="#e3f1fb";ctx.fillRect(0,0,300,220);
      let sp=0;
      for(const p of ps){p.x+=rnd(-step,step);p.y+=rnd(-step,step);p.x=Math.max(5,Math.min(295,p.x));p.y=Math.max(5,Math.min(215,p.y));sp+=Math.hypot(p.x-150,p.y-110);ctx.fillStyle="#d63384";ctx.beginPath();ctx.arc(p.x,p.y,4,0,6.28);ctx.fill()}
      $(pid,el).textContent="O‘rtacha tarqalish: "+Math.round(sp/ps.length)+" px";
    });
    return cv;

/* ---------- Render ---------- */
const scores={};let cur=1;
function render(n){
  cleanups.forEach(f=>f());cleanups=[];cur=n;
  const t=T[n-1],app=$("#app");
  $$(".tp").forEach(c=>c.classList.toggle("on",+c.dataset.n===n));
  app.innerHTML=`<div class="card"><div class="tag">${t.ch}-bob: ${t.ch===1?"Tabiatni o‘rganish":"Modda va uning xossalari"} • ${t.n}-mavzu</div><h2>${t.n}-mavzu. ${t.title}</h2>
  ${t.note?`<div class="note">ℹ️ ${t.note}</div>`:""}
  <h3 style="margin-top:12px">🎯 Dars maqsadi</h3><p>${t.goal}</p>
  <div class="plan">${t.plan.map(p=>`<div><b>${p[0]}</b><br>${p[1]}</div>`).join("")}</div>
  <div class="note"><b>Esda tuting:</b> kuzatish natijalarini aniq qayd eting va xulosani dalillar bilan asoslang.</div></div>
  <div class="card"><h3>🧪 Interaktiv simulyatsiya — ${t.simT}</h3><div id="sim"></div><div class="safe">⚠️ ${SAFE}</div></div>
  <div class="card"><h3>🛠 Amaliy mashg‘ulot</h3><p>${t.prac}</p><b>Kuzatuv kundaligi</b><p>1. Nima kuzatdim?</p><textarea placeholder="Kuzatuvingizni shu yerga yozing..."></textarea><p>2. Qanday xulosa chiqardim?</p><textarea placeholder="Xulosangizni yozing..."></textarea></div>
  <div class="card"><h3>📝 Bilimingizni tekshiring — 5 ta test</h3><div id="quiz"></div><p class="score" id="qs">Natija: ${scores[n]!=null?scores[n]+" / 5":"—"}</p></div>
  <div class="card"><h3>💬 Mustahkamlash uchun savollar</h3><ol class="rev">${t.rev.map(r=>`<li>${r}<textarea placeholder="Javobingiz..."></textarea></li>`).join("")}</ol></div>
  <div class="card"><h3>🎲 Ta’limiy o‘yinlar va metodlar</h3><div class="plan"><div><b>Aqliy hujum</b><br>5 daqiqa: “Bu mavzuda nimalarni bilamiz?” savoliga fikrlar aytiladi.</div><div><b>Klaster</b><br>7 daqiqa: mavzu atamalarini markaziy tushuncha atrofida bog‘lang.</div><div><b>Juftlikda izohla</b><br>5 daqiqa: sherigingizga bir atamani tushuntiring va misol keltiring.</div><div><b>To‘g‘ri xulosani top</b><br>Bir o‘quvchi kuzatuvni aytadi, ikkinchisi ilmiy xulosa chiqaradi; keyin rollarni almashtiring.</div></div></div>
  <div class="card"><h3>📊 Baholash mezoni — 100 ball</h3>${GRADE}</div>
  <div class="nav"><button class="b alt" id="pv" ${n===1?"disabled":""}>← Oldingi</button><button class="b" id="nx" ${n===T.length?"disabled":""}>Keyingi →</button></div>`;
  $("#pv").onclick=()=>go(n-1);$("#nx").onclick=()=>go(n+1);
  SIM[n]($("#sim"));
  // quiz
  let done=0,ok=0;const q=$("#quiz");
  q.innerHTML=t.quiz.map((x,i)=>{const o=shuffle(x.slice(1));return `<div class="q" data-i="${i}"><b>${i+1}. ${x[0]}</b><div class="opts">${o.map(v=>`<button data-c="${v===x[1]?1:0}">${v}</button>`).join("")}</div></div>`}).join("");
  $$(".q",q).forEach(d=>$$("button",d).forEach(b=>b.onclick=()=>{
    if(d.dataset.done)return;d.dataset.done=1;done++;
    $$("button",d).forEach(x=>{if(x.dataset.c==="1")x.classList.add("ok")});
    if(b.dataset.c==="1")ok++;else b.classList.add("no");
    if(done===t.quiz.length){scores[n]=ok;$("#qs").textContent="Natija: "+ok+" / 5 "+(ok===5?"🏆":ok>=4?"👍":"— qayta urinib ko‘ring")}
  }));
  window.scrollTo(0,0);
}
function go(n){if(n>=1&&n<=T.length)render(n)}
(function init(){
  const c=$("#chips");let html=`<div class="ttl">📚 Mavzular</div>`;
  T.forEach((t,i)=>{if(i===0)html+=`<div class="lbl">1-bob. Tabiatni o‘rganish</div>`;if(i===4)html+=`<div class="lbl">2-bob. Modda va uning xossalari</div>`;html+=`<button class="tp" data-n="${t.n}"><i>${t.n}.</i><span>${t.title}</span></button>`});
  c.innerHTML=html;$$(".tp").forEach(b=>b.onclick=()=>go(+b.dataset.n));
  render(1);
})();
