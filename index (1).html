:root{--bg:#EDF1F2;--surface:#fff;--fg:#12262C;--muted:#51656B;--line:#CBD6D9;--accent:#0B6E6A;--accent-ink:#fff;--accent-soft:#D5EAE8;--menu-w:310px}

.item{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;width:100%;text-align:left;font:inherit;color:var(--fg);background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer;min-height:44px}
.item:hover{background:var(--accent-soft)}
.item .n{width:44px;white-space:nowrap;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:.85rem;display:grid;place-items:center}
.item .t{font-size:.92rem;font-weight:600;line-height:1.3}
.item .s{display:block;font-size:.76rem;color:var(--muted);font-weight:400;margin-top:2px}
.item.active{background:var(--accent);color:var(--accent-ink)}
.item.active .n{background:rgba(255,255,255,.22);color:var(--accent-ink)}
.item.active .s{color:inherit;opacity:.85}
.item:focus-visible,.toggle:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toggle,.scrim{display:none}
@media (min-width:1100px){main{margin-right:var(--menu-w)}}
@media (max-width:1099px){
 aside{top:calc(max(12px,env(safe-area-inset-top,0px)) + 54px);right:max(12px,env(safe-area-inset-right,0px));width:min(92vw,340px);max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px - env(safe-area-inset-top,0px));opacity:0;visibility:hidden;transform:translateY(-8px)}
 body.open aside{opacity:1;visibility:visible;transform:none}

 body.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}aside{transition:none}}

e-area-inset-right,0px))}\n.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:28px}\nh1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}\nh1{font-size:clamp(2rem,8vw,3rem);font-weight:800;letter-spacing:-.01em}\nh2{font-size:1.45rem;font-weight:800}\nh3{font-size:1.05rem;font-weight:600}\np{margin:0}\n.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}\n.lead{color:var(--muted);font-size:1.05rem;max-width:60ch}\n.chips{display:flex;flex-wrap:wrap;gap:8px}\n.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--muted)}\nbutton.chip{font:inherit;font-size:.85rem;cursor:pointer;color:var(--fg);min-height:40px}\nbutton.chip:active{background:var(--accent-soft)}\n.head{display:flex;flex-direction:column;gap:12px}\nsection{display:flex;flex-direction:column;gap:14px;min-width:0}\n.sh{display:flex;align-items:center;gap:12px}\n.num{flex:none;width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}\n.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}\nul.plain{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}\n.lab{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}\n/* bosqichlar */\n.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}\n.bar i{display:block;height:100%}\n.bar i:nth-child(1){background:#7FB7B2;flex:5}.bar i:nth-child(2){background:var(--accent);flex:15}\n.bar i:nth-child(3){background:#E0A24A;flex:10}.bar i:nth-child(4){background:var(--circle);flex:10}.bar i:nth-child(5){background:#8A9AA0;flex:5}\n.stage{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}\n.min{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1;color:var(--accent)}\n.min small{display:block;font-family:var(--f-body);font-weight:500;font-size:.75rem;color:var(--muted);margin-top:4px}\n.stage h3{margin-bottom:4px}\n.stage p,.stage li{color:var(--muted);font-size:.95rem}\n/* tushunchalar */\ndl{margin:0;display:flex;flex-direction:column;gap:12px}\ndt{font-weight:600}\ndd{margin:2px 0 0;color:var(--muted)}\n.scroll{overflow-x:auto}\ntable{border-collapse:collapse;width:100%;min-width:480px;font-size:.92rem}\nth,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}\nth{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n/* simulyatsiya */\ncanvas{display:block;width:100%;max-width:440px;aspect-ratio:340/400;margin:0 auto;border-radius:12px;background:var(--surface);border:1px solid var(--line)}\n.ctl{display:flex;flex-direction:column;gap:12px}\n.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n.btn{font:inherit;font-weight:600;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;padding:8px 10px}\n.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}\n.btn:active{transform:translateY(1px)}\n:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\ninput[type=range]{width:100%;height:44px;accent-color:var(--accent);margin:0}\n.read{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n.read div{background:var(--accent-soft);border-radius:10px;padding:8px;text-align:center;font-size:.8rem;color:var(--muted)}\n.read b{display:block;font-family:var(--f-display);font-size:1.35rem;color:var(--fg);font-variant-numeric:tabular-nums}\n.cmp{display:flex;flex-direction:column;gap:8px;font-size:.9rem}\n.cmp .row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}\n.cmp .track{background:var(--accent-soft);border-radius:6px;height:22px;position:relative}\n.cmp .fill{height:100%;border-radius:6px;background:var(--accent);min-width:3px}\n.cmp .fill.g{background:var(--circle)}\n.cmp span.v{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem}\ndetails{border:1px solid var(--line);border-radius:12px;background:var(--surface)}\nsummary{cursor:pointer;padding:12px 14px;font-weight:600;min-height:44px}\ndetails .in{padding:0 14px 14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}\nol.q{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}\n/* test */\n.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}\n.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}\n.lvl{font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}\n.qtext{font-weight:600}\n.opt{font:inherit;text-align:left;min-height:52px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:flex;gap:10px;align-items:flex-start}\n.opt b{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem}\n.opt.ok{background:var(--ok-soft);border-color:var(--ok)}\n.opt.bad{background:var(--bad-soft);border-color:var(--bad)}\n.exp{font-size:.92rem;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}\n.score{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}\n.score b{font-family:var(--f-display);font-size:1.6rem}\n/* o'yin */\n.gstats{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}\n.gboard{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.gcol{display:flex;flex-direction:column;gap:8px;min-width:0}\n.card{font:inherit;font-size:.9rem;min-height:64px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-align:center;overflow-wrap:anywhere}\n.card.term{font-weight:600}\n.card.sel{border-color:var(--accent);background:var(--accent-soft)}\n.card.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}\n.card.shake{border-color:var(--bad);background:var(--bad-soft)}\n.mark{margin-top:2px}\n.foot{font-size:.85rem;color:var(--muted)}\n@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}\n<\/style>\n<style>:root{color-scheme:light}@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){color-scheme:dark}}body{margin:0}[hidden]{display:none!important}<\/style>\n<style>html,body{margin:0}<\/style><\/head>\n<body>\n<div class=\"wrap\">\n\n<header class=\"head\">\n  <div class=\"eyebrow\">6-sinf · Tabiiy fanlar · Geografik xaritalar · 1-dars<\/div>\n  <h1>Xarita nima?<\/h1>\n  <p class=\"lead\">Xarita turlari, ahamiyati va globusdan farqi. 45 daqiqalik dars rejasi, simulyatsiya, test va o'yin bir joyda.<\/p>\n  <div class=\"chips\">\n    <span class=\"chip\">45 daqiqa<\/span><span class=\"chip\">Juftlik va guruh ishi<\/span><span class=\"chip\">11–12 yosh<\/span>\n  <\/div>\n  <div class=\"chips\" aria-label=\"Bo'limlarga o'tish\">\n    <button class=\"chip\" data-go=\"s1\">1 Maqsad<\/button>\n    <button class=\"chip\" data-go=\"s2\">2 Bosqichlar<\/button>\n    <button class=\"chip\" data-go=\"s3\">3 Tushunchalar<\/button>\n    <button class=\"chip\" data-go=\"s4\">4 Simulyatsiya<\/button>\n    <button class=\"chip\" data-go=\"s5\">5 Test<\/button>\n    <button class=\"chip\" data-go=\"s6\">6 O'yin<\/button>\n    <button class=\"chip\" data-go=\"s7\">Maslahat<\/button>\n  <\/div>\n<\/header>\n\n<section id=\"s1\">\n  <div class=\"sh\"><div class=\"num\">1<\/div><h2>Mavzu, maqsad, natijalar<\/h2><\/div>\n  <div class=\"panel\">\n    <div class=\"lab\">Dars mavzusi<\/div>\n    <p><b>Xarita nima? Xarita turlari va ahamiyati. Xarita va globus farqi.<\/b><\/p>\n    <div class=\"lab\">Maqsad<\/div>\n    <ul class=\"plain\">\n      <li><b>Bilim:<\/b> xarita va globusni ta'riflash, xarita turlarini sanash.<\/li>\n      <li><b>Ko'nikma:<\/b> xarita va globusni solishtirish, masalaga mos xaritani tanlash.<\/li>\n      <li><b>Qadriyat:<\/b> xaritadan kundalik hayotda foydalanishga qiziqish uyg'otish.<\/li>\n    <\/ul>\n    <div class=\"lab\">Kutilgan natijalar. Dars oxirida o'quvchi:<\/div>\n    <ul class=\"plain\">\n      <li>xaritaga o'z so'zi bilan ta'rif beradi;<\/li>\n      <li>globus va xaritaning kamida 3 ta farqini aytadi;<\/li>\n      <li>siyosiy, fizik va tematik xaritani bir-biridan ajratadi;<\/li>\n      <li>xaritada nega o'lchamlar buzilishini oddiy misolda (Grenlandiya) tushuntiradi.<\/li>\n    <\/ul>\n    <div class=\"lab\">Jihozlar<\/div>\n    <p>Globus, devor xaritasi (dunyo va O'zbekiston), atlas, proyektor yoki telefonlar, o'yin kartochkalari (6 juft).<\/p>\n  <\/div>\n<\/section>\n\n<section id=\"s2\">\n  <div class=\"sh\"><div class=\"num\">2<\/div><h2>Dars bosqichlari<\/h2><\/div>\n  <div class=\"bar\" role=\"img\" aria-label=\"Vaqt taqsimoti: 5, 15, 10, 10, 5 daqiqa\"><i><\/i><i><\/i><i><\/i><i><\/i><i><\/i><\/div>\n  <div class=\"panel\">\n    <div class=\"stage\"><div class=\"min\">5<small>daqiqa<\/small><\/div><div>\n      <h3>Motivatsiya: «Yo'lni chiz»<\/h3>\n      <p>Juftlikda: qo'shni sinfdan kelgan mehmonga maktabdan bog'gacha yo'lni so'zsiz, faqat chizma bilan tushuntiring (2 daqiqa). Keyin 2–3 juft chizmasini ko'rsatadi. Savollar: nima chizdingiz? Belgilar nima uchun kerak? Yer yuzasi uchun ham shunday chizma bormi?<\/p><\/div><\/div>\n  <\/div>\n  <div class=\"panel\">\n    <div class=\"stage\"><div class=\"min\">15<small>daqiqa<\/small><\/div><div>\n      <h3>Yangi mavzu<\/h3>\n      <ul class=\"plain\">\n        <li>6 daq. o'qituvchi suhbati: xarita, globus, xarita turlari (3-bo'lim).<\/li>\n        <li>5 daq. simulyatsiya: globusdan xaritaga (4-bo'lim), juftlikda.<\/li>\n        <li>4 daq. kuzatish savollarini muhokama qilish.<\/li>\n      <\/ul><\/div><\/div>\n  <\/div>\n  <div class=\"panel\">\n    <div class=\"stage\"><div class=\"min\">10<small>daqiqa<\/small><\/div><div>\n      <h3>Mustahkamlash: «Xarita turini top»<\/h3>\n      <p>4 kishilik guruhlarda juftlashtirish o'yini (6-bo'lim): 7 daqiqa o'yin, 3 daqiqa javoblarni tekshirish.<\/p><\/div><\/div>\n  <\/div>\n  <div class=\"panel\">\n    <div class=\"stage\"><div class=\"min\">10<small>daqiqa<\/small><\/div><div>\n      <h3>Baholash<\/h3>\n      <p>8 savollik test (5-bo'lim): 8 daqiqa yakka ishlash, 2 daqiqa tekshirish. Baholash mezonlari oxirida.<\/p><\/div><\/div>\n  <\/div>\n  <div class=\"panel\">\n    <div class=\"stage\"><div class=\"min\">5<small>daqiqa<\/small><\/div><div>\n      <h3>Uy vazifasi<\/h3>\n      <ul class=\"plain\">\n        <li>Majburiy: maktabdan uygacha yo'lning oddiy xaritasini chizing, kamida 4 ta shartli belgi qo'ying.<\/li>\n        <li>Qo'shimcha: uyingizdagi 3 xil xaritani (atlas, navigator, hudud xaritasi) toping va qaysi turga kirishini yozing.<\/li>\n      <\/ul><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s3\">\n  <div class=\"sh\"><div class=\"num\">3<\/div><h2>Asosiy tushunchalar<\/h2><\/div>\n  <div class=\"panel\">\n    <dl>\n      <div><dt>Xarita<\/dt><dd>Yer yuzasining butun yoki bir qismining tekislikda kichraytirib, shartli belgilar yordamida tasvirlanishi.<\/dd><\/div>\n      <div><dt>Globus<\/dt><dd>Yerning kichraytirilgan, shar shaklidagi hajmli modeli.<\/dd><\/div>\n      <div><dt>Atlas<\/dt><dd>Xaritalar to'plami (kitob ko'rinishida).<\/dd><\/div>\n      <div><dt>Shartli belgi<\/dt><dd>Xaritada narsani ko'rsatuvchi rasm yoki rang. Masalan, ko'k rang suv, nuqta shahar.<\/dd><\/div>\n    <\/dl>\n  <\/div>\n  <div class=\"panel\">\n    <h3>Xarita turlari<\/h3>\n    <div class=\"lab\">Mazmuniga ko'ra<\/div>\n    <ul class=\"plain\">\n      <li><b>Siyosiy:<\/b> davlatlar chegarasi, poytaxt va shaharlar. Masalan, O'zbekiston xaritasida Toshkent, Samarqand, Nukus, Termiz.<\/li>\n      <li><b>Fizik (tabiiy):<\/b> tog'lar, tekisliklar, daryolar, dengizlar. Masalan, Orol dengizi, Qizilqum.<\/li>\n      <li><b>Tematik (mavzuli):<\/b> bitta mavzuni ko'rsatadi: iqlim, aholi zichligi, yo'llar, tuproq.<\/li>\n      <li><b>Konturli:<\/b> faqat chiziqlar bor, o'quvchi o'zi to'ldiradi.<\/li>\n    <\/ul>\n    <div class=\"lab\">Qamroviga ko'ra<\/div>\n    <p>Dunyo xaritasi, materik xaritasi, davlat xaritasi (O'zbekiston), viloyat va shahar rejasi.<\/p>\n  <\/div>\n  <div class=\"panel\">\n    <h3>Xaritaning ahamiyati<\/h3>\n    <ul class=\"plain\">\n      <li>Yo'lni topish va safarni rejalashtirish (Toshkent–Nukus yo'li).<\/li>\n      <li>Davlatlar, tabiat va aholini o'rganish.<\/li>\n      <li>Qurilish, qishloq xo'jaligi, ob-havo kuzatuvi uchun kerak.<\/li>\n      <li>Tabiatdagi o'zgarishlarni kuzatish (masalan, Orol dengizi hududi).<\/li>\n    <\/ul>\n  <\/div>\n  <div class=\"panel\">\n    <h3>Globus va xarita farqi<\/h3>\n    <div class=\"scroll\">\n      <table>\n        <thead><tr><th><\/th><th>Globus<\/th><th>Xarita<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td><b>Shakli<\/b><\/td><td>Shar, hajmli<\/td><td>Tekis (qog'oz, ekran)<\/td><\/tr>\n          <tr><td><b>Buzilish<\/b><\/td><td>Deyarli yo'q<\/td><td>Bor, qutblarga yaqin joylarda ko'proq<\/td><\/tr>\n          <tr><td><b>Ko'rinish<\/b><\/td><td>Bir vaqtda Yerning faqat yarmi<\/td><td>Butun Yer bir qarashda<\/td><\/tr>\n          <tr><td><b>Qulaylik<\/b><\/td><td>Katta, olib yurish noqulay<\/td><td>Yengil, olib yurish oson<\/td><\/tr>\n          <tr><td><b>Batafsillik<\/b><\/td><td>Kam<\/td><td>Istalgan hudud juda batafsil chizilishi mumkin<\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"s4\">\n  <div class=\"sh\"><div class=\"num\">4<\/div><h2>Simulyatsiya: globusdan xaritaga<\/h2><\/div>\n  <p class=\"lead\">Slayderni suring yoki «Animatsiya» tugmasini bosing. Globus tekislikka yoyilganda 9 ta bir xil doira qanday o'zgarishini kuzating.<\/p>\n  <canvas id=\"sim\" aria-label=\"Globusdan xaritaga o'tish: bir xil doiralar xaritada kattalashadi\"><\/canvas>\n  <div class=\"ctl\">\n    <input type=\"range\" id=\"sl\" min=\"0\" max=\"100\" value=\"0\" aria-label=\"Globus (0) dan xarita (100) gacha\">\n    <div class=\"btns\">\n      <button class=\"btn\" id=\"bGlobe\">Globus<\/button>\n      <button class=\"btn pri\" id=\"bPlay\">Animatsiya<\/button>\n      <button class=\"btn\" id=\"bMap\">Xarita<\/button>\n    <\/div>\n    <div class=\"lab\">Doiraning chiziqli kattalashishi (xaritada)<\/div>\n    <div class=\"read\">\n      <div>Ekvator, 0°<b id=\"r0\">×1.00<\/b><\/div>\n      <div>30° kenglik<b id=\"r30\">×1.00<\/b><\/div>\n      <div>60° kenglik<b id=\"r60\">×1.00<\/b><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"panel\">\n    <h3>Haqiqiy yuzalar<\/h3>\n    <div class=\"cmp\">\n      <div class=\"row\"><span>Afrika<\/span><div class=\"track\"><div class=\"fill\" style=\"width:100%\"><\/div><\/div><\/div>\n      <div class=\"row\"><span><\/span><span class=\"v\">taxminan 30,4 mln km²<\/span><\/div>\n      <div class=\"row\"><span>Grenlandiya<\/span><div class=\"track\"><div class=\"fill g\" style=\"width:7.2%\"><\/div><\/div><\/div>\n      <div class=\"row\"><span><\/span><span class=\"v\">taxminan 2,2 mln km². Afrikadan deyarli 14 marta kichik.<\/span><\/div>\n    <\/div>\n    <p class=\"foot\">Dunyo xaritasining ko'pchiligida (Merkator usuli) Grenlandiya Afrikaga yaqin kattalikda ko'rinadi. Sababi shu simulyatsiyada ko'rinib turibdi.<\/p>\n  <\/div>\n  <div class=\"panel\">\n    <h3>Kuzatish savollari<\/h3>\n    <ol class=\"q\">\n      <li>Slayderni «Xarita» tomon surganda ekvatordagi doira o'zgardimi? Qutbga yaqin doirachi?<\/li>\n      <li>Qaysi doiralar eng ko'p kattalashdi? Nima uchun deb o'ylaysiz?<\/li>\n      <li>Xaritada ikki joyning kattaligini solishtirmoqchi bo'lsangiz, nimani tekshirib olish kerak?<\/li>\n    <\/ol>\n    <details><summary>Javoblar (o'qituvchi uchun)<\/summary><div class=\"in\">\n      <p>1. Ekvatorda deyarli o'zgarmadi, 60° kenglikda kattalashib ketdi.<\/p>\n      <p>2. Qutblarga yaqin doiralar. Shar sirtini tekislikka yoyganda parallellar uzunligi bir xil bo'lib qoladi, aslida esa qutbga borgan sari qisqaradi. Shuning uchun u joylar cho'ziladi.<\/p>\n      <p>3. Haqiqiy yuzani (raqamlar, atlas jadvali) yoki globusni tekshirish kerak. Xaritadagi ko'rinishga ishonib bo'lmaydi.<\/p>\n    <\/div><\/details>\n  <\/div>\n<\/section>\n\n<section id=\"s5\">\n  <div class=\"sh\"><div class=\"num\">5<\/div><h2>Mustahkamlash testi<\/h2><\/div>\n  <p class=\"lead\">8 ta savol: 3 ta oson, 3 ta o'rta, 2 ta qiyin. Javobni bosing, izoh darhol chiqadi.<\/p>\n  <div id=\"quiz\" style=\"display:flex;flex-direction:column;gap:12px\"><\/div>\n  <div id=\"qres\"><\/div>\n<\/section>\n\n<section id=\"s6\">\n  <div class=\"sh\"><div class=\"num\">6<\/div><h2>Mantiqiy o'yin: «Xarita turini top»<\/h2><\/div>\n  <div class=\"panel\">\n    <div class=\"lab\">Qoidalar<\/div>\n    <ul class=\"plain\">\n      <li>Chap ustundan atamani, o'ng ustundan unga mos izohni bosing.<\/li>\n      <li>To'g'ri juft yashil bo'lib qoladi. Xato bo'lsa qizarib, qayta tanlanadi.<\/li>\n      <li>Maqsad: 6 juftni eng kam xato va eng tez topish.<\/li>\n    <\/ul>\n    <p class=\"foot\"><b>Sinfda:<\/b> 4 kishilik guruh, 12 ta qog'oz kartochka (6 atama + 6 izoh), vaqt 7 daqiqa. Eng kam xato qilgan guruh g'olib, xato teng bo'lsa tezroq tugatgani.<\/p>\n  <\/div>\n  <div class=\"gstats\"><span>Topildi: <b id=\"gFound\">0<\/b>/6<\/span><span>Xato: <b id=\"gErr\">0<\/b><\/span><span>Vaqt: <b id=\"gTime\">0<\/b> s<\/span><\/div>\n  <div class=\"gboard\" id=\"gboard\"><\/div>\n  <div id=\"gres\"><\/div>\n  <button class=\"btn\" id=\"gReset\">Qaytadan boshlash<\/button>\n  <details><summary>Javoblar (o'qituvchi uchun)<\/summary><div class=\"in\">\n    <p>Siyosiy xarita: davlatlar chegarasi va poytaxtlar.<\/p>\n    <p>Fizik xarita: tog'lar, tekisliklar va dengizlar.<\/p>\n    <p>Iqlim xaritasi: harorat va yog'in miqdori.<\/p>\n    <p>Yo'llar xaritasi: Toshkent–Samarqand avtomagistrali.<\/p>\n    <p>Globus: Yerning shar shaklidagi modeli.<\/p>\n    <p>Konturli xarita: faqat chiziqlar bor, o'zing to'ldirasan.<\/p>\n  <\/div><\/details>\n<\/section>\n\n<section id=\"s7\">\n  <div class=\"sh\"><div class=\"num\">+<\/div><h2>O'qituvchi uchun maslahatlar<\/h2><\/div>\n  <div class=\"panel\">\n    <ul class=\"plain\">\n      <li>Telefon yetmasa, simulyatsiyani proyektorda ko'rsating, juftlar kuzatish savollarini daftarda yozsin.<\/li>\n      <li>Grenlandiya misolini globusda ham ko'rsating: ip bilan Grenlandiya va Afrika kengligini o'lchatsa, farq yaqqol bo'ladi.<\/li>\n      <li>Motivatsiyadagi chizmalarni doskaga osib qo'ying, dars oxirida «bizning belgilarimiz» bilan xaritaning shartli belgilarini solishtiring.<\/li>\n      <li>Guruhlarni aralash tuzing: kuchli va sust o'quvchi bir guruhda bo'lsin, har kim bir marta kartochka tanlasin.<\/li>\n      <li>Tezroq tugatganlarga qo'shimcha topshiriq: O'zbekiston siyosiy xaritasida 5 ta shaharni topib yozish.<\/li>\n    <\/ul>\n  <\/div>\n  <div class=\"panel\">\n    <h3>Baholash mezonlari<\/h3>\n    <div class=\"scroll\">\n      <table>\n        <thead><tr><th>Test (8 savol)<\/th><th>Baho<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td>7–8 to'g'ri<\/td><td>5<\/td><\/tr>\n          <tr><td>5–6 to'g'ri<\/td><td>4<\/td><\/tr>\n          <tr><td>4 to'g'ri<\/td><td>3<\/td><\/tr>\n          <tr><td>0–3 to'g'ri<\/td><td>2 (mavzuni takrorlash tavsiya etiladi)<\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n    <div class=\"scroll\">\n      <table>\n        <thead><tr><th>Guruh ishi<\/th><th>Yuqori<\/th><th>O'rta<\/th><th>Past<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td>Faollik<\/td><td>Hamma qatnashdi<\/td><td>Ko'pchilik<\/td><td>Bir-ikki kishi<\/td><\/tr>\n          <tr><td>Hamkorlik<\/td><td>Maslahatlashdi, tinglashdi<\/td><td>Qisman<\/td><td>Alohida ishladi<\/td><\/tr>\n          <tr><td>Aniqlik<\/td><td>0–1 xato<\/td><td>2–3 xato<\/td><td>4 va undan ko'p<\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n    <p class=\"foot\">Simulyatsiya muhokamasi va chizma ishi alohida ball bilan rag'batlantirilishi mumkin. Mezonlar taklif sifatida berilgan, maktabingiz tizimiga moslang.<\/p>\n  <\/div>\n<\/section>\n\n<\/div>\n\n<script>\n(function(){\n  var reduce=false; try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}\n  /* navigatsiya */\n  document.querySelectorAll('[data-go]').forEach(function(b){\n    b.addEventListener('click',function(){\n      var el=document.getElementById(b.getAttribute('data-go'));\n      if(el) el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});\n    });\n  });\n\n  /* ---------- SIMULYATSIYA ---------- */\n  var cv=document.getElementById('sim'),ctx=cv.getContext('2d');\n  var W=340,H=400,CX=W/2,CY=H/2,R=150,S=R/(Math.PI/2),PH0=15*Math.PI/180;\n  var dpr=Math.min(window.devicePixelRatio||1,3);\n  cv.width=W*dpr;cv.height=H*dpr;\n  var t=0,raf=0;\n  var ease=function(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};\n  function col(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}\n  function P(lon,lat,e){\n    var l=lon*Math.PI/180,p=lat*Math.PI/180;\n    var gx=R*Math.cos(p)*Math.sin(l);\n    var gy=R*(Math.cos(PH0)*Math.sin(p)-Math.sin(PH0)*Math.cos(p)*Math.cos(l));\n    var vis=Math.sin(PH0)*Math.sin(p)+Math.cos(PH0)*Math.cos(p)*Math.cos(l);\n    var mx=S*l,my=S*Math.log(Math.tan(Math.PI/4+p/2));\n    return {x:CX+gx+(mx-gx)*e,y:CY-(gy+(my-gy)*e),v:(vis>=-0.02||e>=0.5)};\n  }\n  function line(pts){\n    var open=false;ctx.beginPath();\n    pts.forEach(function(q){\n      if(!q.v){open=false;return}\n      if(!open){ctx.moveTo(q.x,q.y);open=true}else ctx.lineTo(q.x,q.y);\n    });\n    ctx.stroke();\n  }\n  function circlePts(lon,lat,rad,e){\n    var out=[],p0=lat*Math.PI/180,l0=lon*Math.PI/180,d=rad*Math.PI/180;\n    for(var i=0;i<=36;i++){\n      var b=i/36*2*Math.PI;\n      var p1=Math.asin(Math.sin(p0)*Math.cos(d)+Math.cos(p0)*Math.sin(d)*Math.cos(b));\n      var l1=l0+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(p0),Math.cos(d)-Math.sin(p0)*Math.sin(p1));\n      out.push(P(l1*180/Math.PI,p1*180/Math.PI,e));\n    }\n    return out;\n  }\n  function label(txt,lon,lat,e,dx,dy){\n    var q=P(lon,lat,e);if(!q.v)return;\n    ctx.font='600 12px Onest, system-ui, sans-serif';ctx.lineWidth=3;ctx.strokeStyle=col('--surface');\n    ctx.strokeText(txt,q.x+dx,q.y+dy);ctx.fillStyle=col('--fg');ctx.fillText(txt,q.x+dx,q.y+dy);\n  }\n  function draw(){\n    var e=ease(t),i,j;\n    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);\n    ctx.fillStyle=col('--sea');\n    ctx.globalAlpha=1-e;ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fill();\n    var yt=S*Math.log(Math.tan(Math.PI/4+35*Math.PI/180));\n    ctx.globalAlpha=e;ctx.fillRect(CX-R,CY-yt,2*R,2*yt);\n    ctx.globalAlpha=1;\n    ctx.strokeStyle=col('--grid');ctx.lineWidth=1;ctx.globalAlpha=.55;\n    for(i=-90;i<=90;i+=30){var m=[];for(j=-70;j<=70;j+=5)m.push(P(i,j,e));line(m)}\n    for(i=-60;i<=60;i+=30){var pr=[];for(j=-90;j<=90;j+=5)pr.push(P(j,i,e));line(pr)}\n    ctx.globalAlpha=1;\n    var eq=[];for(j=-90;j<=90;j+=5)eq.push(P(j,0,e));\n    ctx.strokeStyle=col('--accent');ctx.lineWidth=2.2;line(eq);\n    var cs=[[-45,0],[0,0],[45,0],[-45,30],[0,30],[45,30],[-45,60],[0,60],[45,60]];\n    ctx.lineWidth=1.6;\n    cs.forEach(function(c){\n      var pts=circlePts(c[0],c[1],7,e);\n      if(!pts.every(function(q){return q.v}))return;\n      ctx.beginPath();pts.forEach(function(q,k){k?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();\n      ctx.fillStyle=col('--circle');ctx.globalAlpha=.5;ctx.fill();ctx.globalAlpha=1;\n      ctx.strokeStyle=col('--circle');ctx.stroke();\n    });\n    ctx.strokeStyle=col('--grid');ctx.lineWidth=1.5;\n    if(e<.99){ctx.globalAlpha=1-e;ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.stroke()}\n    ctx.globalAlpha=e;ctx.strokeRect(CX-R,CY-yt,2*R,2*yt);ctx.globalAlpha=1;\n    ctx.textAlign='left';\n    label('Afrika',20,-14,e,-18,4);\n    label('Grenlandiya',-42,68,e,-30,-4);\n    var tk=P(69.3,41.3,e);\n    if(tk.v){ctx.fillStyle=col('--accent');ctx.beginPath();ctx.arc(tk.x,tk.y,4,0,Math.PI*2);ctx.fill();label('Toshkent',69.3,41.3,e,-50,-8)}\n    label('Ekvator',-88,0,e,2,-5);\n    [0,30,60].forEach(function(l){\n      var f=1+e*(1/Math.cos(l*Math.PI/180)-1);\n      document.getElementById('r'+l).textContent='×'+f.toFixed(2);\n    });\n  }\n  var sl=document.getElementById('sl');\n  sl.addEventListener('input',function(){cancelAnimationFrame(raf);t=sl.value/100;draw()});\n  function go(target){\n    cancelAnimationFrame(raf);\n    if(reduce){t=target;sl.value=t*100;draw();return}\n    var from=t,t0=performance.now(),dur=Math.max(400,2600*Math.abs(target-from));\n    (function step(now){\n      var k=Math.min(1,(now-t0)/dur);\n      t=from+(target-from)*k;sl.value=t*100;draw();\n      if(k<1)raf=requestAnimationFrame(step);\n    })(t0);\n  }\n  document.getElementById('bGlobe').addEventListener('click',function(){go(0)});\n  document.getElementById('bMap').addEventListener('click',function(){go(1)});\n  document.getElementById('bPlay').addEventListener('click',function(){go(t<0.5?1:0)});\n  draw();\n  try{document.fonts.ready.then(draw)}catch(e){}\n  try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw)}catch(e){}\n  try{new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}\n\n  /* ---------- TEST ---------- */\n  var Q=[\n    {l:'Oson',q:\"Xarita nima?\",o:[\"Yerning shar shaklidagi kichraytirilgan modeli\",\"Yer yuzasining tekislikda kichraytirib, shartli belgilar bilan tasviri\",\"Faqat okeanlarning rasmi\",\"Shahar ko'cha adding:0}.wrap{max-width:none}.lesson{break-before:page}nav,.simulation button{display:none}.panel,header{break-inside:avoid}}\n<\/style><style>header,#nav{display:none!important}body{padding-top:0}<\/style><\/head><body><main class=\"wrap\">\n<header><div class=\"eyebrow\">Geografiya · 7-bob va 8-bob<\/div><h1>Geografiya darslari: 41–53-mavzular<\/h1>\n<p class=\"lead\">Siz yuborgan mundarijadagi barcha mavzular uchun moslashtirilgan interaktiv HTML qo‘llanma. Har bir mavzuda maqsadlar, asosiy tushunchalar, topshiriq, interaktiv model va test mavjud.<\/p>\n<p><b>Qanday foydalaniladi:<\/b> yuqoridagi mavzu tugmasini bosing. Simulyatsiyadagi qiymatlarni o‘zgartiring, test savollariga javob bering. Internet talab qilmaydi.<\/p>\n<nav id=\"nav\"><button class=\"pill\" data-target=\"topic-41\">41. Geografik xaritalar<\/button><button class=\"pill\" data-target=\"topic-42\">42. Amaliy mashg‘ulot: Masshtab<\/button><button class=\"pill\" data-target=\"topic-43\">43. Geografik koordinatalar<\/button><button class=\"pill\" data-target=\"topic-44\">44. Joy balandligini o‘lchash<\/button><button class=\"pill\" data-target=\"topic-45\">45. Amaliy mashg‘ulot: Relyefni…<\/button><button class=\"pill\" data-target=\"topic-46\">46. Litosfera plitalari<\/button><button class=\"pill\" data-target=\"topic-47\">47. Amaliy mashg‘ulot: Vaqt min…<\/button><button class=\"pill\" data-target=\"topic-48\">48. Gidrosfera va uning qismlar…<\/button><button class=\"pill\" data-target=\"topic-49\">49. Atmosfera tuzilishi<\/button><button class=\"pill\" data-target=\"topic-50\">50. Havo bosimi<\/button><button class=\"pill\" data-target=\"topic-51\">51. Havo harorati<\/button><button class=\"pill\" data-target=\"topic-52\">52. Amaliy mashg‘ulot: Havo har…<\/button><button class=\"pill\" data-target=\"topic-53\">53. Biosfera<\/button><\/nav><\/header>\n\n    <article class=\"lesson\" id=\"topic-41\">\n      <div class=\"eyebrow\">41-mavzu · Nazariy dars<\/div>\n      <h2>Geografik xaritalar<\/h2>\n      <p class=\"lead\">Geografik xarita — Yer yuzasi yoki uning bir qismini kichraytirib, shartli belgilar va ma’lum masshtab asosida tekislikda tasvirlashdir.<\/p>\n      <div class=\"grid\">\n        <section class=\"panel\"><h3>Dars maqsadlari<\/h3><ul><li>Xarita, masshtab, legenda va shartli belgilarni tushuntirish<\/li><li>Siyosiy, fizik va mavzuli xaritalarni farqlash<\/li><li>Xaritadan geografik ma’lumot topish<\/li><\/ul><\/section>\n        <section class=\"panel\"><h3>Asosiy tushunchalar<\/h3><div class='term'><b>Xarita<\/b><p>Yer yuzasining kichraytirilgan, umumlashtirilgan tasviri.<\/p><\/div><div class='term'><b>Masshtab<\/b><p>Xaritadagi masofa bilan joydagi haqiqiy masofa nisbatini ko‘rsatadi.<\/p><\/div><div class='term'><b>Legenda<\/b><p>Xaritadagi shartli belgilar ma’nosi tushuntirilgan qism.<\/p><\/div><div class='term'><b>Fizik xarita<\/b><p>Tog‘, tekislik, daryo, ko‘l va boshqa tabiiy obyektlarni ko‘rsatadi.<\/p><\/div><div class='term'><b>Mavzuli xarita<\/b><p>Bitta hodisa yoki mavzuni, masalan, iqlim yoki aholi zichligini ko‘rsatadi.<\/p><\/div><\/section>\n      <\/div>\n      <section class=\"panel\"><h3>Amaliy topshiriq<\/h3><p>Atlasdan O‘zbekistonning fizik va siyosiy xaritalarini toping. Har biridan 3 ta obyektni aniqlang va belgilarini izohlang.<\/p><\/section>\n      <section class=\"panel simulation\">\n        <h3>Interaktiv model: Xarita masshtabi va masofani o‘rganish<\/h3><p>Haqiqiy masofa = xaritadagi masofa × masshtab maxraji. Quyida xaritadagi masofa va masshtabni o‘zgartirib, natijani kuzating.<\/p>\n        \n        \n        \n        \n        \n        \n        \n        \n        \n        \n        \n        \n      <\/section>\n      <section class=\"panel\"><h3>Mustahkamlash testi<\/h3><div class=\"quiz\" data-quiz='[{&quot;q&quot;: &quot;Xaritadagi masofa va haqiqiy masofa nisbatini nima ko‘rsatadi?&quot;, &quot;o&quot;: [&quot;Legenda&quot;, &quot;Masshtab&quot;, &quot;Meridian&quot;, &quot;Relyef&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Tog‘lar va daryolarni ko‘rsatadigan xarita qaysi?&quot;, &quot;o&quot;: [&quot;Siyosiy&quot;, &quot;Fizik&quot;, &quot;Aholi&quot;, &quot;Sanoat&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Shartli belgilar izohi qayerda beriladi?&quot;, &quot;o&quot;: [&quot;Sarlavhada&quot;, &quot;Leg endada&quot;, &quot;Masshtabda&quot;, &quot;Ramkada&quot;], &quot;a&quot;: 1}]'><\/div><\/section>\n      <details class=\"teacher\"><summary>O‘qituvchi uchun tavsiya<\/summary><p>Darsni qisqa savol-javob bilan boshlang. Asosiy tushunchalarni xarita, chizma yoki kundalik hayotdan olingan misol bilan tushuntiring. Amaliy topshiriqni juftlikda bajartiring, so‘ng test natijalarini birgalikda muhokama qiling.<\/p><\/details>\n    <\/article>\n\n    <article class=\"lesson\" id=\"topic-42\">\n      <div class=\"eyebrow\">42-mavzu · Amaliy mashg‘ulot<\/div>\n      <h2>Amaliy mashg‘ulot: Masshtab<\/h2>\n      <p class=\"lead\">Masshtab xaritadagi masofani haqiqiy masofaga aylantirishga yordam beradi. U sonli, nomli yoki chiziqli ko‘rinishda berilishi mumkin.<\/p>\n      <div class=\"grid\">\n        <section class=\"panel\"><h3>Dars maqsadlari<\/h3><ul><li>Masshtab turlarini ajratish<\/li><li>Xaritadagi masofani haqiqiy masofaga hisoblash<\/li><li>Kilometr va santimetr birliklarini to‘g‘ri aylantirish<\/li><\/ul><\/section>\n        <section class=\"panel\"><h3>Asosiy tushunchalar<\/h3><div class='term'><b>Sonli masshtab<\/b><p>Masalan, 1:100 000 — xaritadagi 1 sm joyda 100 000 sm, ya’ni 1 km.<\/p><\/div><div class='term'><b>Nomli masshtab<\/b><p>Masalan, 1 sm da 2 km.<\/p><\/div><div class='term'><b>Chiziqli masshtab<\/b><p>Masofani chiziq va bo‘linmalar yordamida o‘lchash usuli.<\/p><\/div><div class='term'><b>Haqiqiy masofa<\/b><p>Yer yuzasidagi ikki nuqta orasidagi masofa.<\/p><\/div><\/section>\n      <\/div>\n      <section class=\"panel\"><h3>Amaliy topshiriq<\/h3><p>Mashq: 1:200 000 masshtabli xaritada ikki qishloq orasidagi masofa 4 sm. Haqiqiy masofani hisoblang. So‘ng 1:500 000 masshtabda 3 sm uchun hisobni takrorlang.<\/p><\/section>\n      <section class=\"panel simulation\">\n        <h3>Interaktiv model: Masshtab kalkulyatori<\/h3><p>Xaritadagi masofani santimetrda kiriting va sonli masshtab maxrajini tanlang. Natija kilometrda hisoblanadi.<\/p>\n        <div class=\"controls\"><label>Xaritadagi masofa (sm) <input id=\"mapdist-42\" type=\"number\" min=\"0\" value=\"4\" step=\"0.5\"><\/label><label>Masshtab maxraji <select id=\"scale-42\"><option>100000<\/option><option selected>200000<\/option><option>500000<\/option><option>1000000<\/option><\/select><\/label><output id=\"out-42\">Haqiqiy masofa: 8 km<\/output><\/div>\n        \n        \n        \n        \n        \n        \n        \n        \n        \n        \n        \n      <\/section>\n      <section class=\"panel\"><h3>Mustahkamlash testi<\/h3><div class=\"quiz\" data-quiz='[{&quot;q&quot;: &quot;1:100 000 masshtabda xaritadagi 1 sm necha km?&quot;, &quot;o&quot;: [&quot;0,1 km&quot;, &quot;1 km&quot;, &quot;10 km&quot;, &quot;100 km&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;1:200 000 masshtabda 4 sm haqiqiy masofaga teng?&quot;, &quot;o&quot;: [&quot;2 km&quot;, &quot;4 km&quot;, &quot;8 km&quot;, &quot;80 km&quot;], &quot;a&quot;: 2}, {&quot;q&quot;: &quot;Masshtab nimani ifodalaydi?&quot;, &quot;o&quot;: [&quot;Balandlikni&quot;, &quot;Masofalar nisbatini&quot;, &quot;Haroratni&quot;, &quot;Yo‘nalishni&quot;], &quot;a&quot;: 1}]'><\/div><\/section>\n      <details class=\"teacher\"><summary>O‘qituvchi uchun tavsiya<\/summary><p>Darsni qisqa savol-javob bilan boshlang. Asosiy tushunchalarni xarita, chizma yoki kundalik hayotdan olingan misol bilan tushuntiring. Amaliy topshiriqni juftlikda bajartiring, so‘ng test natijalarini birgalikda muhokama qiling.<\/p><\/details>\n    <\/article>\n\n    <article class=\"lesson\" id=\"topic-43\">\n      <div class=\"eyebrow\">43-mavzu · Nazariy dars<\/div>\n      <h2>Geografik koordinatalar<\/h2>\n      <p class=\"lead\">Geografik koordinatalar — Yer yuzasidagi nuqtaning geografik kenglik va geografik uzunlik orqali aniqlanadigan o‘rnidir.<\/p>\n      <div class=\"grid\">\n        <section class=\"panel\"><h3>Dars maqsadlari<\/h3><ul><li>Ekvator va bosh meridianni aniqlash<\/li><li>Kenglik va uzunlikni farqlash<\/li><li>Koordinatalar yordamida nuqta o‘rnini topish<\/li><\/ul><\/section>\n        <section class=\"panel\"><h3>Asosiy tushunchalar<\/h3><div class='term'><b>Geografik kenglik<\/b><p>Nuqtaning ekvatordan shimol yoki janubga tomon burchak masofasi.<\/p><\/div><div class='term'><b>Geografik uzunlik<\/b><p>Nuqtaning bosh meridiandan sharq yoki g‘arbga tomon burchak masofasi.<\/p><\/div><div class='term'><b>Ekvator<\/b><p>Yer sharini Shimoliy va Janubiy yarimsharlarga ajratuvchi 0° kenglik chizig‘i.<\/p><\/div><div class='term'><b>Bosh meridian<\/b><p>0° uzunlik meridiani; Grinvich orqali o‘tadi.<\/p><\/div><\/section>\n      <\/div>\n      <section class=\"panel\"><h3>Amaliy topshiriq<\/h3><p>Atlasdan Toshkent shahrining taxminiy koordinatalarini toping. So‘ng ekvatorga va bosh meridianga nisbatan qaysi tomonda ekanini yozing.<\/p><\/section>\n      <section class=\"panel simulation\">\n        <h3>Interaktiv model: Koordinatalar tekisligi<\/h3><p>Kenglik va uzunlik qiymatlarini o‘zgartiring. Nuqta xarita panjarasida joyini o‘zgartiradi.<\/p>\n        \n        <div class=\"controls\"><label>Kenglik (°) <input id=\"lat-43\" type=\"range\" min=\"-90\" max=\"90\" value=\"41\"><\/label><label>Uzunlik (°) <input id=\"lon-43\" type=\"range\" min=\"-180\" max=\"180\" value=\"69\"><\/label><output id=\"coordout-43\">41° kenglik, 69° uzunlik<\/output><div class=\"coordgrid\" id=\"coordgrid-43\"><span>90°<\/span><span>0°<\/span><span>−90°<\/span><i><\/i><\/div><\/div>\n        \n        \n        \n        \n        \n        \n        \n        \n        \n        \n      <\/section>\n      <section class=\"panel\"><h3>Mustahkamlash testi<\/h3><div class=\"quiz\" data-quiz='[{&quot;q&quot;: &quot;Geografik kenglik qaysi chiziqdan hisoblanadi?&quot;, &quot;o&quot;: [&quot;Bosh meridian&quot;, &quot;Ekvator&quot;, &quot;Qutb doirasi&quot;, &quot;Tropik&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;0° geografik uzunlik nima deyiladi?&quot;, &quot;o&quot;: [&quot;Ekvator&quot;, &quot;Bosh meridian&quot;, &quot;Tropik&quot;, &quot;Parallel&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;40° shimoliy kenglikdagi nuqta qayerda?&quot;, &quot;o&quot;: [&quot;Janubiy yarimsharda&quot;, &quot;Shimoliy yarimsharda&quot;, &quot;Ekvatorning o‘zida&quot;, &quot;Faqat okeanda&quot;], &quot;a&quot;: 1}]'><\/div><\/section>\n      <details class=\"teacher\"><summary>O‘qituvchi uchun tavsiya<\/summary><p>Darsni qisqa savol-javob bilan boshlang. Asosiy tushunchalarni xarita, chizma yoki kundalik hayotdan olingan misol bilan tushuntiring. Amaliy topshiriqni juftlikda bajartiring, so‘ng test natijalarini birgalikda muhokama qiling.<\/p><\/details>\n    <\/article>\n\n    <article class=\"lesson\" id=\"topic-44\">\n      <div class=\"eyebrow\">44-mavzu · Nazariy dars<\/div>\n      <h2>Joy balandligini o‘lchash<\/h2>\n      <p class=\"lead\">Joy balandligi odatda dengiz sathiga nisbatan aniqlanadi. Mutlaq balandlik va nisbiy balandlik bir-biridan farq qiladi.<\/p>\n      <div class=\"grid\">\n        <section class=\"panel\"><h3>Dars maqsadlari<\/h3><ul><li>Mutlaq va nisbiy balandlikni izohlash<\/li><li>Gorizontallarni xaritada tanish<\/li><li>Balandlik belgilaridan foydalanish<\/li><\/ul><\/section>\n        <section class=\"panel\"><h3>Asosiy tushunchalar<\/h3><div class='term'><b>Mutlaq balandlik<\/b><p>Nuqtaning o‘rtacha dengiz sathidan balandligi.<\/p><\/div><div class='term'><b>Nisbiy balandlik<\/b><p>Ikki nuqta balandliklari orasidagi farq.<\/p><\/div><div class='term'><b>Gorizontallar<\/b><p>Bir xil mutlaq balandlikdagi nuqtalarni birlashtiruvchi chiziqlar.<\/p><\/div><div class='term'><b>Balandlik shkalasi<\/b><p>Ranglar yoki belgilar orqali balandlikni ko‘rsatish usuli.<\/p><\/div><\/section>\n      <\/div>\n      <section class=\"panel\"><h3>Amaliy topshiriq<\/h3><p>Topografik xaritadagi ikki nuqtaning balandligini o‘qing. Masalan, A nuqta 250 m, B nuqta 430 m bo‘lsa, nisbiy balandlikni hisoblang.<\/p><\/section>\n      <section class=\"panel simulation\">\n        <h3>Interaktiv model: Balandlik farqini hisoblash<\/h3><p>Ikki nuqtaning balandligini o‘zgartirib, nisbiy balandlikni hisoblang.<\/p>\n        \n        \n        <div class=\"controls\"><label>A nuqta balandligi (m) <input id=\"altA-44\" type=\"number\" value=\"250\"><\/label><label>B nuqta balandligi (m) <input id=\"altB-44\" type=\"number\" value=\"430\"><\/label><output id=\"altout-44\">Nisbiy balandlik: 180 m<\/output><\/div>\n        \n        \n        \n        \n        \n        \n        \n        \n        \n      <\/section>\n      <section class=\"panel\"><h3>Mustahkamlash testi<\/h3><div class=\"quiz\" data-quiz='[{&quot;q&quot;: &quot;Dengiz sathiga nisbatan balandlik nima?&quot;, &quot;o&quot;: [&quot;Nisbiy balandlik&quot;, &quot;Mutlaq balandlik&quot;, &quot;Masshtab&quot;, &quot;Kenglik&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;A=250 m, B=430 m. B nuqta A dan necha metr baland?&quot;, &quot;o&quot;: [&quot;180 m&quot;, &quot;250 m&quot;, &quot;430 m&quot;, &quot;680 m&quot;], &quot;a&quot;: 0}, {&quot;q&quot;: &quot;Bir xil balandlikdagi nuqtalarni nima birlashtiradi?&quot;, &quot;o&quot;: [&quot;Meridianlar&quot;, &quot;Gorizontallar&quot;, &quot;Parallellar&quot;, &quot;Izobarlar&quot;], &quot;a&quot;: 1}]'><\/div><\/section>\n      <details class=\"teacher\"><summary>O‘qituvchi uchun tavsiya<\/summary><p>Darsni qisqa savol-javob bilan boshlang. Asosiy tushunchalarni xarita, chizma yoki kundalik hayotdan olingan misol bilan tushuntiring. Amaliy topshiriqni juftlikda bajartiring, so‘ng test natijalarini birgalikda muhokama qiling.<\/p><\/details>\n    <\/article>\n\n    <article class=\"lesson\" id=\"topic-45\">\n      <div class=\"eyebrow\">45-mavzu · Amaliy mashg‘ulot<\/div>\n      <h2>Amaliy mashg‘ulot: Relyefning xaritalarda gorizontallar bilan tasvirlanishi<\/h2>\n      <p class=\"lead\">Gorizontallar yordamida tepalik, vodiy va yonbag‘irlarning shakli hamda nishabligini xaritada ifodalash mumkin.<\/p>\n      <div class=\"grid\">\n        <section class=\"panel\"><h3>Dars maqsadlari<\/h3><ul><li>Gorizontallarni o‘qish<\/li><li>Chiziqlar oralig‘idan yonbag‘ir tikligini aniqlash<\/li><li>Relyef shakllarini sxemada ko‘rsatish<\/li><\/ul><\/section>\n        <section class=\"panel\"><h3>Asosiy tushunchalar<\/h3><div class='term'><b>Gorizontallar oralig‘i<\/b><p>Ketma-ket gorizontallar orasidagi balandlik farqi.<\/p><\/div><div class='term'><b>Tik yonbag‘ir<\/b><p>Gorizontallar bir-biriga yaqin joylashgan hudud.<\/p><\/div><div class='term'><b>Yotiq yonbag‘ir<\/b><p>Gorizontallar orasidagi masofa kattaroq bo‘lgan hudud.<\/p><\/div><div class='term'><b>Relyef<\/b><p>Yer yuzasidagi notekisliklar majmui.<\/p><\/div><\/section>\n      <\/div>\n      <section class=\"panel\"><h3>Amaliy topshiriq<\/h3><p>Daftarda 100, 120, 140 va 160 m balandlikdagi yopiq gorizontallarni chizing. Markazga qarab balandlik ortsa, tepalik; kamaysa, botiq shaklini ko‘rsating.<\/p><\/section>\n      <section class=\"panel simulation\">\n        <h3>Interaktiv model: Gorizontallar modeli<\/h3><p>Balandlik va yonbag‘ir tikligini o‘zgartirib, sxemadagi gorizontallar oralig‘ini kuzating.<\/p>\n        \n        \n        \n        <div class=\"controls\"><label>Yonbag‘ir tikligi <input id=\"slope-45\" type=\"range\" min=\"1\" max=\"10\" value=\"5\"><\/label><output id=\"slopeout-45\">Gorizontallar: o‘rtacha zich<\/output><svg id=\"contour-45\" viewBox=\"0 0 320 150\" role=\"img\" aria-label=\"Gorizontallar chizmasi\"><\/svg><\/div>\n        \n        \n        \n        \n        \n        \n        \n        \n      <\/section>\n      <section class=\"panel\"><h3>Mustahkamlash testi<\/h3><div class=\"quiz\" data-quiz='[{&quot;q&quot;: &quot;Gorizontallar bir-biriga juda yaqin bo‘lsa, yonbag‘ir qanday?&quot;, &quot;o&quot;: [&quot;Yotiq&quot;, &quot;Tik&quot;, &quot;Mutlaqo tekis&quot;, &quot;Suvli&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Gorizontallar nimani birlashtiradi?&quot;, &quot;o&quot;: [&quot;Bir xil haroratli nuqtalarni&quot;, &quot;Bir xil balandlikli nuqtalarni&quot;, &quot;Bir xil bosimli nuqtalarni&quot;, &quot;Bir xil kenglikni&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Relyef nima?&quot;, &quot;o&quot;: [&quot;Havo tarkibi&quot;, &quot;Yer yuzasi notekisliklari&quot;, &quot;Daryo oqimi&quot;, &quot;Yog‘in turi&quot;], &quot;a&quot;: 1}]'><\/div><\/section>\n      <details class=\"teacher\"><summary>O‘qituvchi uchun tavsiya<\/summary><p>Darsni qisqa savol-javob bilan boshlang. Asosiy tushunchalarni xarita, chizma yoki kundalik hayotdan olingan misol bilan tushuntiring. Amaliy topshiriqni juftlikda bajartiring, so‘ng test natijalarini birgalikda muhokama qiling.<\/p><\/details>\n    <\/article>\n\n    <article class=\"lesson\" id=\"topic-46\">\n      <div class=\"eyebrow\">46-mavzu · Nazariy dars<\/div>\n      <h2>Litosfera plitalari<\/h2>\n      <p class=\"lead\">Litosfera Yer po‘stining va yuqori mantiyaning qattiq qismidan tashkil topgan bo‘lib, yirik plitalarga bo‘lingan. Plitalarning harakati ko‘plab geologik jarayonlarga sabab bo‘ladi.<\/p>\n      <div class=\"grid\">\n        <section class=\"panel\"><h3>Dars maqsadlari<\/h3><ul><li>Litosfera va plita tushunchalarini ta’riflash<\/li><li>Plitalar chegaralarining asosiy turlarini bilish<\/li><li>Zilzila va vulqonlarning tarqalishini plitalar bilan bog‘lash<\/li><\/ul><\/section>\n        <section class=\"panel\"><h3>Asosiy tushunchalar<\/h3><div class='term'><b>Litosfera<\/b><p>Yer po‘sti va yuqori mantiyaning qattiq qismi.<\/p><\/div><div class='term'><b>Litosfera plitasi<\/b><p>Litosferaning katta, nisbatan yaxlit bo‘lagi.<\/p><\/div><div class='term'><b>Divergent chegara<\/b><p>Plitalar bir-biridan uzoqlashadigan chegara.<\/p><\/div><div class='term'><b>Konvergent chegara<\/b><p>Plitalar bir-biriga yaqinlashadigan chegara.<\/p><\/div><div class='term'><b>Transform chegara<\/b><p>Plitalar yonma-yon siljiydigan chegara.<\/p><\/div><\/section>\n      <\/div>\n      <section class=\"panel\"><h3>Amaliy topshiriq<\/h3><p>Dunyo xaritasidan Tinch okeani atrofidagi seysmik faol hududlarni toping va ularning plita chegaralariga yaqinligini kuzating.<\/p><\/section>\n      <section class=\"panel simulation\">\n        <h3>Interaktiv model: Plitalar harakati modeli<\/h3><p>Harakat turini tanlang: uzoqlashish, yaqinlashish yoki yonma-yon siljish. Sxema plitalar yo‘nalishini ko‘rsatadi.<\/p>\n        \n        \n        \n        \n        <div class=\"controls\"><label>Plitalar harakati <select id=\"plate-46\"><option value=\"div\">Uzoqlashish<\/option><option value=\"conv\">Yaqinlashish<\/option><option value=\"trans\">Yonma-yon siljish<\/option><\/select><\/label><div class=\"plates\" id=\"plates-46\"><div>PLITA A<\/div><span>↔<\/span><div>PLITA B<\/div><\/div><output id=\"plateout-46\">Plitalar bir-biridan uzoqlashadi.<\/output><\/div>\n        \n        \n        \n        \n        \n        \n        \n      <\/section>\n      <section class=\"panel\"><h3>Mustahkamlash testi<\/h3><div class=\"quiz\" data-quiz='[{&quot;q&quot;: &quot;Litosfera nimalardan tashkil topgan?&quot;, &quot;o&quot;: [&quot;Faqat atmosfera&quot;, &quot;Yer po‘sti va yuqori mantiyaning qattiq qismi&quot;, &quot;Faqat yadro&quot;, &quot;Faqat okean suvi&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Plitalar bir-biridan uzoqlashadigan chegara?&quot;, &quot;o&quot;: [&quot;Konvergent&quot;, &quot;Divergent&quot;, &quot;Transform&quot;, &quot;Tinch&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Zilzilalar ko‘pincha qayerlarda sodir bo‘ladi?&quot;, &quot;o&quot;: [&quot;Faqat tekislik markazida&quot;, &quot;Plitalar chegaralari yaqinida&quot;, &quot;Faqat qutblarda&quot;, &quot;Faqat cho‘llarda&quot;], &quot;a&quot;: 1}]'><\/div><\/section>\n      <details class=\"teacher\"><summary>O‘qituvchi uchun tavsiya<\/summary><p>Darsni qisqa savol-javob bilan boshlang. Asosiy tushunchalarni xarita, chizma yoki kundalik hayotdan olingan misol bilan tushuntiring. Amaliy topshiriqni juftlikda bajartiring, so‘ng test natijalarini birgalikda muhokama qiling.<\/p><\/details>\n    <\/article>\n\n    <article class=\"lesson\" id=\"topic-47\">\n      <div class=\"eyebrow\">47-mavzu · Amaliy mashg‘ulot<\/div>\n      <h2>Amaliy mashg‘ulot: Vaqt mintaqalarini yasash<\/h2>\n      <p class=\"lead\">Yer o‘z o‘qi atrofida aylangani sababli turli meridianlarda mahalliy vaqt farq qiladi. Vaqt mintaqalari bu farqni qulay tartibga solish uchun qo‘llanadi.<\/p>\n      <div class=\"grid\">\n        <section class=\"panel\"><h3>Dars maqsadlari<\/h3><ul><li>Yerning aylanishi va vaqt farqi bog‘liqligini tushuntirish<\/li><li>15° uzunlik taxminan 1 soatga mos kelishini qo‘llash<\/li><li>Oddiy vaqt mintaqasi modelini yasash<\/li><\/ul><\/section>\n        <section class=\"panel\"><h3>Asosiy tushunchalar<\/h3><div class='term'><b>Vaqt mintaqasi<\/b><p>Bir xil standart vaqt qabul qilingan hudud.<\/p><\/div><div class='term'><b>Bosh meridian<\/b><p>Vaqt hisobida boshlang‘ich meridian sifatida olinadigan 0° meridian.<\/p><\/div><div class='term'><b>UTC<\/b><p>Xalqaro muvofiqlashtirilgan vaqt.<\/p><\/div><div class='term'><b>Mahalliy vaqt<\/b><p>Meridianga qarab aniqlanadigan vaqt.<\/p><\/div><\/section>\n      <\/div>\n      <section class=\"panel\"><h3>Amaliy topshiriq<\/h3><p>Qog‘oz doirani 24 bo‘lakka ajrating va har biriga bir soatlik mintaqa sifatida belgi qo‘ying. Sharq tomonga har 15° da vaqt bir soat oldinga, g‘arb tomonga bir soat orqaga siljishini ko‘rsating.<\/p><\/section>\n      <section class=\"panel simulation\">\n        <h3>Interaktiv model: Vaqt farqi kalkulyatori<\/h3><p>Boshlang‘ich vaqt va ikki hudud orasidagi soat farqini kiriting. Natijada ikkinchi hudud vaqti hisoblanadi.<\/p>\n        \n        \n        \n        \n        \n        <div class=\"controls\"><label>Boshlang‘ich vaqt <input id=\"time-47\" type=\"time\" value=\"12:00\"><\/label><label>Vaqt farqi (soat, −12 dan +14 gacha) <input id=\"offset-47\" type=\"number\" min=\"-12\" max=\"14\" value=\"5\"><\/label><output id=\"timeout-47\">Yangi hudud vaqti: 17:00<\/output><\/div>\n        \n        \n        \n        \n        \n        \n      <\/section>\n      <section class=\"panel\"><h3>Mustahkamlash testi<\/h3><div class=\"quiz\" data-quiz='[{&quot;q&quot;: &quot;Yer 360° ni taxminan necha soatda aylanadi?&quot;, &quot;o&quot;: [&quot;12&quot;, &quot;24&quot;, &quot;36&quot;, &quot;48&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;15° uzunlik farqi taxminan qancha vaqtga teng?&quot;, &quot;o&quot;: [&quot;15 daqiqa&quot;, &quot;30 daqiqa&quot;, &quot;1 soat&quot;, &quot;6 soat&quot;], &quot;a&quot;: 2}, {&quot;q&quot;: &quot;Sharqqa tomon vaqt odatda qanday o‘zgaradi?&quot;, &quot;o&quot;: [&quot;Oldinga siljiydi&quot;, &quot;Orqaga siljiydi&quot;, &quot;O‘zgarmaydi&quot;, &quot;Faqat yozda o‘zgaradi&quot;], &quot;a&quot;: 0}]'><\/div><\/section>\n      <details class=\"teacher\"><summary>O‘qituvchi uchun tavsiya<\/summary><p>Darsni qisqa savol-javob bilan boshlang. Asosiy tushunchalarni xarita, chizma yoki kundalik hayotdan olingan misol bilan tushuntiring. Amaliy topshiriqni juftlikda bajartiring, so‘ng test natijalarini birgalikda muhokama qiling.<\/p><\/details>\n    <\/article>\n\n    <article class=\"lesson\" id=\"topic-48\">\n      <div class=\"eyebrow\">48-mavzu · Nazariy dars<\/div>\n      <h2>Gidrosfera va uning qismlari<\/h2>\n      <p class=\"lead\">Gidrosfera — Yerning suv qobig‘i. U okean va dengizlar, daryo va ko‘llar, muzliklar, yerosti suvlari hamda atmosfera namligini o‘z ichiga oladi.<\/p>\n      <div class=\"grid\">\n        <section class=\"panel\"><h3>Dars maqsadlari<\/h3><ul><li>Gidrosferaning tarkibiy qismlarini sanash<\/li><li>Suv aylanishi bosqichlarini tushuntirish<\/li><li>Chuchuk va sho‘r suvni farqlash<\/li><\/ul><\/section>\n        <section class=\"panel\"><h3>Asosiy tushunchalar<\/h3><div class='term'><b>Gidrosfera<\/b><p>Yer yuzasi, yer osti va atmosferadagi suvlar majmui.<\/p><\/div><div class='term'><b>Okean<\/b><p>Yer yuzasidagi eng katta uzluksiz sho‘r suv havzasi.<\/p><\/div><div class='term'><b>Yerosti suvlari<\/b><p>Tog‘ jinslari orasida va yer qatlamlarida joylashgan suvlar.<\/p><\/div><div class='term'><b>Suv aylanishi<\/b><p>Suvning bug‘lanish, kondensatsiya va yog‘in orqali uzluksiz harakati.<\/p><\/div><\/section>\n      <\/div>\n      <section class=\"panel\"><h3>Amaliy topshiriq<\/h3><p>Suv aylanishini strelkalar bilan chizing: okean → bug‘lanish → bulut → yog‘in → daryo va yerosti suvlari → okean.<\/p><\/section>\n      <section class=\"panel simulation\">\n        <h3>Interaktiv model: Suv aylanishi ketma-ketligi<\/h3><p>Bosqichlarni tanlab, suvning tabiatdagi aylanish yo‘lini ko‘rib chiqing.<\/p>\n        \n        \n        \n        \n        \n        \n        <div class=\"watercycle\"><span>Okean<\/span><b>→<\/b><span>Bug‘lanish<\/span><b>→<\/b><span>Bulut<\/span><b>→<\/b><span>Yog‘in<\/span><b>→<\/b><span>Daryo<\/span><\/div><button class=\"btn\" onclick=\"this.previousElementSibling.classList.toggle('active')\">Suv aylanishini ko‘rsatish/yashirish<\/button>\n        \n        \n        \n        \n        \n      <\/section>\n      <section class=\"panel\"><h3>Mustahkamlash testi<\/h3><div class=\"quiz\" data-quiz='[{&quot;q&quot;: &quot;Yerning suv qobig‘i nima deyiladi?&quot;, &quot;o&quot;: [&quot;Atmosfera&quot;, &quot;Litosfera&quot;, &quot;Gidrosfera&quot;, &quot;Biosfera&quot;], &quot;a&quot;: 2}, {&quot;q&quot;: &quot;Suv bug‘ining sovib tomchilarga aylanishi?&quot;, &quot;o&quot;: [&quot;Bug‘lanish&quot;, &quot;Kondensatsiya&quot;, &quot;Oqim&quot;, &quot;Muzlash&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Dengiz va okean suvi odatda qanday?&quot;, &quot;o&quot;: [&quot;Chuchuk&quot;, &quot;Sho‘r&quot;, &quot;Distillangan&quot;, &quot;Suvsiz&quot;], &quot;a&quot;: 1}]'><\/div><\/section>\n      <details class=\"teacher\"><summary>O‘qituvchi uchun tavsiya<\/summary><p>Darsni qisqa savol-javob bilan boshlang. Asosiy tushunchalarni xarita, chizma yoki kundalik hayotdan olingan misol bilan tushuntiring. Amaliy topshiriqni juftlikda bajartiring, so‘ng test natijalarini birgalikda muhokama qiling.<\/p><\/details>\n    <\/article>\n\n    <article class=\"lesson\" id=\"topic-49\">\n      <div class=\"eyebrow\">49-mavzu · Nazariy dars<\/div>\n      <h2>Atmosfera tuzilishi<\/h2>\n      <p class=\"lead\">Atmosfera — Yerni o‘rab turgan gaz qobig‘i. U bir necha qatlamdan iborat bo‘lib, ob-havo hodisalari asosan troposferada kechadi.<\/p>\n      <div class=\"grid\">\n        <section class=\"panel\"><h3>Dars maqsadlari<\/h3><ul><li>Atmosferaning vazifalarini tushuntirish<\/li><li>Asosiy qatlamlarni ketma-ket aytish<\/li><li>Ob-havo hodisalari sodir bo‘ladigan qatlamni aniqlash<\/li><\/ul><\/section>\n        <section class=\"panel\"><h3>Asosiy tushunchalar<\/h3><div class='term'><b>Atmosfera<\/b><p>Yerni o‘rab turgan gaz qobig‘i.<\/p><\/div><div class='term'><b>Troposfera<\/b><p>Atmosferaning eng quyi qatlami; bulut, yog‘in va ko‘plab ob-havo hodisalari shu yerda yuz beradi.<\/p><\/div><div class='term'><b>Stratosfera<\/b><p>Troposferaning ustidagi qatlam; unda ozon qatlami joylashgan.<\/p><\/div><div class='term'><b>Ozon qatlami<\/b><p>Quyoshning zararli ultrabinafsha nurlarining katta qismini yutadi.<\/p><\/div><\/section>\n      <\/div>\n      <section class=\"panel\"><h3>Amaliy topshiriq<\/h3><p>Atmosfera qatlamlarini pastdan yuqoriga qarab chizing va har bir qatlamga bittadan xususiyat yozing.<\/p><\/section>\n      <section class=\"panel simulation\">\n        <h3>Interaktiv model: Atmosfera qatlamlari<\/h3><p>Qatlamni tanlang va uning balandlikdagi o‘rni hamda asosiy xususiyatini ko‘ring.<\/p>\n        \n        \n        \n        \n        \n        \n        \n        <div class=\"layers\"><div class=\"layer\" data-layer=\"0\">Troposfera<\/div><div class=\"layer\" data-layer=\"1\">Stratosfera<\/div><div class=\"layer\" data-layer=\"2\">Mezosfera<\/div><div class=\"layer\" data-layer=\"3\">Termosfera<\/div><div class=\"layer\" data-layer=\"4\">Ekzosfera<\/div><\/div><p id=\"layerinfo-49\">Qatlam ustiga bosing.<\/p>\n        \n        \n        \n        \n      <\/section>\n      <section class=\"panel\"><h3>Mustahkamlash testi<\/h3><div class=\"quiz\" data-quiz='[{&quot;q&quot;: &quot;Ob-havo hodisalari asosan qaysi qatlamda sodir bo‘ladi?&quot;, &quot;o&quot;: [&quot;Troposfera&quot;, &quot;Mezosfera&quot;, &quot;Termosfera&quot;, &quot;Ekzosfera&quot;], &quot;a&quot;: 0}, {&quot;q&quot;: &quot;Yerni o‘rab turgan gaz qobig‘i?&quot;, &quot;o&quot;: [&quot;Gidrosfera&quot;, &quot;Atmosfera&quot;, &quot;Litosfera&quot;, &quot;Biosfera&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Ozon qatlami nimadan himoya qilishga yordam beradi?&quot;, &quot;o&quot;: [&quot;Zilziladan&quot;, &quot;Ultrabinafsha nurlardan&quot;, &quot;Shamoldan&quot;, &quot;Yomg‘irdan&quot;], &quot;a&quot;: 1}]'><\/div><\/section>\n      <details class=\"teacher\"><summary>O‘qituvchi uchun tavsiya<\/summary><p>Darsni qisqa savol-javob bilan boshlang. Asosiy tushunchalarni xarita, chizma yoki kundalik hayotdan olingan misol bilan tushuntiring. Amaliy topshiriqni juftlikda bajartiring, so‘ng test natijalarini birgalikda muhokama qiling.<\/p><\/details>\n    <\/article>\n\n    <article class=\"lesson\" id=\"topic-50\">\n      <div class=\"eyebrow\">50-mavzu · Nazariy dars<\/div>\n      <h2>Havo bosimi<\/h2>\n      <p class=\"lead\">Havo bosimi — atmosfera havosining Yer yuzasi va jismlarga ko‘rsatadigan bosimidir. Balandlik oshgan sari havo bosimi odatda kamayadi.<\/p>\n      <div class=\"grid\">\n        <section class=\"panel\"><h3>Dars maqsadlari<\/h3><ul><li>Havo bosimi tushunchasini izohlash<\/li><li>Balandlik va bosim orasidagi bog‘lanishni tushuntirish<\/li><li>Barometrning vazifasini bilish<\/li><\/ul><\/section>\n        <section class=\"panel\"><h3>Asosiy tushunchalar<\/h3><div class='term'><b>Havo bosimi<\/b><p>Havoning og‘irligi va harakati tufayli yuzaga keladigan bosim.<\/p><\/div><div class='term'><b>Barometr<\/b><p>Atmosfera bosimini o‘lchaydigan asbob.<\/p><\/div><div class='term'><b>Millibar/gektopaskal<\/b><p>Atmosfera bosimini ifodalashda ishlatiladigan birliklar.<\/p><\/div><div class='term'><b>Balandlik<\/b><p>Dengiz sathidan yuqoriga ko‘tarilgan masofa.<\/p><\/div><\/section>\n      <\/div>\n      <section class=\"panel\"><h3>Amaliy topshiriq<\/h3><p>Tog‘ etagi va cho‘qqisidagi bosim farqini muhokama qiling. Nima uchun baland tog‘larda nafas olish qiyinlashishi mumkinligini tushuntiring.<\/p><\/section>\n      <section class=\"panel simulation\">\n        <h3>Interaktiv model: Balandlik va havo bosimi<\/h3><p>Balandlikni oshirib, bosim ko‘rsatkichining kamayishini kuzating. Model soddalashtirilgan va taxminiydir.<\/p>\n        \n        \n        \n        \n        \n        \n        \n        \n        <div class=\"controls\"><label>Balandlik (m) <input id=\"height-50\" type=\"range\" min=\"0\" max=\"5000\" step=\"100\" value=\"0\"><\/label><output id=\"pressureout-50\">Taxminiy bosim: 1013 hPa<\/output><\/div>\n        \n        \n        \n      <\/section>\n      <section class=\"panel\"><h3>Mustahkamlash testi<\/h3><div class=\"quiz\" data-quiz='[{&quot;q&quot;: &quot;Havo bosimini o‘lchaydigan asbob?&quot;, &quot;o&quot;: [&quot;Termometr&quot;, &quot;Barometr&quot;, &quot;Anemometr&quot;, &quot;Gigrometr&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Balandlik oshganda havo bosimi odatda...&quot;, &quot;o&quot;: [&quot;oshadi&quot;, &quot;kamayadi&quot;, &quot;o‘zgarmaydi&quot;, &quot;nolga teng bo‘ladi&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Havo bosimi qaysi qobiq bilan bog‘liq?&quot;, &quot;o&quot;: [&quot;Gidrosfera&quot;, &quot;Atmosfera&quot;, &quot;Biosfera&quot;, &quot;Litosfera&quot;], &quot;a&quot;: 1}]'><\/div><\/section>\n      <details class=\"teacher\"><summary>O‘qituvchi uchun tavsiya<\/summary><p>Darsni qisqa savol-javob bilan boshlang. Asosiy tushunchalarni xarita, chizma yoki kundalik hayotdan olingan misol bilan tushuntiring. Amaliy topshiriqni juftlikda bajartiring, so‘ng test natijalarini birgalikda muhokama qiling.<\/p><\/details>\n    <\/article>\n\n    <article class=\"lesson\" id=\"topic-51\">\n      <div class=\"eyebrow\">51-mavzu · Nazariy dars<\/div>\n      <h2>Havo harorati<\/h2>\n      <p class=\"lead\">Havo harorati havoning qanchalik issiq yoki sovuqligini bildiradi. U termometr bilan o‘lchanadi va quyosh nuri, balandlik, fasl hamda joyning xususiyatlariga bog‘liq.<\/p>\n      <div class=\"grid\">\n        <section class=\"panel\"><h3>Dars maqsadlari<\/h3><ul><li>Havo haroratini o‘lchash usulini bilish<\/li><li>Kunlik harorat o‘zgarishini tushuntirish<\/li><li>Haroratga ta’sir etuvchi omillarni sanash<\/li><\/ul><\/section>\n        <section class=\"panel\"><h3>Asosiy tushunchalar<\/h3><div class='term'><b>Havo harorati<\/b><p>Havoning issiqlik holatini ifodalovchi kattalik.<\/p><\/div><div class='term'><b>Termometr<\/b><p>Haroratni o‘lchaydigan asbob.<\/p><\/div><div class='term'><b>Sutkalik amplituda<\/b><p>Bir sutkadagi eng yuqori va eng past harorat farqi.<\/p><\/div><div class='term'><b>Izoterma<\/b><p>Xaritada bir xil haroratli nuqtalarni birlashtiruvchi chiziq.<\/p><\/div><\/section>\n      <\/div>\n      <section class=\"panel\"><h3>Amaliy topshiriq<\/h3><p>Bir kun davomida ertalab, tushda va kechqurun haroratni yozib boring. Eng yuqori va eng past qiymatlar farqini toping.<\/p><\/section>\n      <section class=\"panel simulation\">\n        <h3>Interaktiv model: Sutkalik harorat grafigi<\/h3><p>Kun vaqtini va harorat qiymatlarini o‘zgartirib, haroratning kun davomida qanday o‘zgarishini kuzating.<\/p>\n        \n        \n        \n        \n        \n        \n        \n        \n        \n        <div class=\"controls\"><label>Soat <input id=\"hour-51\" type=\"range\" min=\"0\" max=\"23\" value=\"14\"><\/label><label>Harorat (°C) <input id=\"temp-51\" type=\"range\" min=\"-10\" max=\"40\" value=\"24\"><\/label><output id=\"tempout-51\">Soat 14:00 · 24°C<\/output><div class=\"thermometer\"><div id=\"thermofill-51\"><\/div><\/div><\/div>\n        \n        \n      <\/section>\n      <section class=\"panel\"><h3>Mustahkamlash testi<\/h3><div class=\"quiz\" data-quiz='[{&quot;q&quot;: &quot;Haroratni qaysi asbob o‘lchaydi?&quot;, &quot;o&quot;: [&quot;Barometr&quot;, &quot;Termometr&quot;, &quot;Kompas&quot;, &quot;Flyuger&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Eng yuqori va eng past harorat farqi nima?&quot;, &quot;o&quot;: [&quot;Bosim&quot;, &quot;Sutkalik amplituda&quot;, &quot;Namlik&quot;, &quot;Masshtab&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Bir xil haroratli nuqtalarni xaritada nima birlashtiradi?&quot;, &quot;o&quot;: [&quot;Izobaralar&quot;, &quot;Izotermalar&quot;, &quot;Gorizontallar&quot;, &quot;Meridianlar&quot;], &quot;a&quot;: 1}]'><\/div><\/section>\n      <details class=\"teacher\"><summary>O‘qituvchi uchun tavsiya<\/summary><p>Darsni qisqa savol-javob bilan boshlang. Asosiy tushunchalarni xarita, chizma yoki kundalik hayotdan olingan misol bilan tushuntiring. Amaliy topshiriqni juftlikda bajartiring, so‘ng test natijalarini birgalikda muhokama qiling.<\/p><\/details>\n    <\/article>\n\n    <article class=\"lesson\" id=\"topic-52\">\n      <div class=\"eyebrow\">52-mavzu · Amaliy mashg‘ulot<\/div>\n      <h2>Amaliy mashg‘ulot: Havo haroratining sutkalik va yillik amplitudasini aniqlash<\/h2>\n      <p class=\"lead\">Harorat amplitudasi eng yuqori va eng past harorat orasidagi farqdir. Sutkalik amplituda bir sutkada, yillik amplituda esa yil davomida aniqlanadi.<\/p>\n      <div class=\"grid\">\n        <section class=\"panel\"><h3>Dars maqsadlari<\/h3><ul><li>Sutkalik amplitudani hisoblash<\/li><li>Yillik amplitudani oylik ko‘rsatkichlardan aniqlash<\/li><li>Natijani jadval yoki grafikda ifodalash<\/li><\/ul><\/section>\n        <section class=\"panel\"><h3>Asosiy tushunchalar<\/h3><div class='term'><b>Sutkalik amplituda<\/b><p>Bir sutkadagi maksimal va minimal harorat farqi.<\/p><\/div><div class='term'><b>Yillik amplituda<\/b><p>Yilning eng issiq va eng sovuq oylari o‘rtacha haroratlari farqi.<\/p><\/div><div class='term'><b>Maksimal harorat<\/b><p>Kuzatilgan eng yuqori harorat.<\/p><\/div><div class='term'><b>Minimal harorat<\/b><p>Kuzatilgan eng past harorat.<\/p><\/div><\/section>\n      <\/div>\n      <section class=\"panel\"><h3>Amaliy topshiriq<\/h3><p>Sutkalik kuzatuv: maksimal +18°C, minimal +7°C. Amplitudani hisoblang. Yillik misol: iyul +30°C, yanvar −2°C. Yillik amplitudani toping.<\/p><\/section>\n      <section class=\"panel simulation\">\n        <h3>Interaktiv model: Amplituda kalkulyatori<\/h3><p>Maksimal va minimal haroratlarni kiriting. Amplituda ularning ayirmasining musbat qiymati sifatida hisoblanadi.<\/p>\n        \n        \n        \n        \n        \n        \n        \n        \n        \n        \n        <div class=\"controls\"><label>Maksimal harorat (°C) <input id=\"maxT-52\" type=\"number\" value=\"18\"><\/label><label>Minimal harorat (°C) <input id=\"minT-52\" type=\"number\" value=\"7\"><\/label><output id=\"ampout-52\">Amplituda: 11°C<\/output><\/div>\n        \n      <\/section>\n      <section class=\"panel\"><h3>Mustahkamlash testi<\/h3><div class=\"quiz\" data-quiz='[{&quot;q&quot;: &quot;Maksimal +18°C, minimal +7°C. Amplituda?&quot;, &quot;o&quot;: [&quot;7°C&quot;, &quot;11°C&quot;, &quot;18°C&quot;, &quot;25°C&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Iyul +30°C, yanvar −2°C. Yillik amplituda?&quot;, &quot;o&quot;: [&quot;28°C&quot;, &quot;30°C&quot;, &quot;32°C&quot;, &quot;−32°C&quot;], &quot;a&quot;: 2}, {&quot;q&quot;: &quot;Amplituda qanday hisoblanadi?&quot;, &quot;o&quot;: [&quot;Maksimal + minimal&quot;, &quot;Maksimal − minimal&quot;, &quot;Minimal − 0&quot;, &quot;Bosim × vaqt&quot;], &quot;a&quot;: 1}]'><\/div><\/section>\n      <details class=\"teacher\"><summary>O‘qituvchi uchun tavsiya<\/summary><p>Darsni qisqa savol-javob bilan boshlang. Asosiy tushunchalarni xarita, chizma yoki kundalik hayotdan olingan misol bilan tushuntiring. Amaliy topshiriqni juftlikda bajartiring, so‘ng test natijalarini birgalikda muhokama qiling.<\/p><\/details>\n    <\/article>\n\n    <article class=\"lesson\" id=\"topic-53\">\n      <div class=\"eyebrow\">53-mavzu · Nazariy dars<\/div>\n      <h2>Biosfera<\/h2>\n      <p class=\"lead\">Biosfera — tirik organizmlar yashaydigan Yer qobig‘i. U atmosfera, gidrosfera va litosferaning hayot mavjud bo‘lgan qismlari bilan chambarchas bog‘liq.<\/p>\n      <div class=\"grid\">\n        <section class=\"panel\"><h3>Dars maqsadlari<\/h3><ul><li>Biosfera tushunchasini ta’riflash<\/li><li>Tirik organizmlar va tabiiy qobiqlar aloqasini tushuntirish<\/li><li>Insonning biosferaga ta’siriga misollar keltirish<\/li><\/ul><\/section>\n        <section class=\"panel\"><h3>Asosiy tushunchalar<\/h3><div class='term'><b>Biosfera<\/b><p>Tirik organizmlar tarqalgan Yer qobig‘i.<\/p><\/div><div class='term'><b>Ekotizim<\/b><p>Organizmlar va ular yashaydigan muhitning o‘zaro bog‘langan tizimi.<\/p><\/div><div class='term'><b>Biologik xilma-xillik<\/b><p>Tirik organizmlar turlari va ularning xilma-xilligi.<\/p><\/div><div class='term'><b>Tabiatni muhofaza qilish<\/b><p>Tabiiy muhit va tirik organizmlarni asrashga qaratilgan faoliyat.<\/p><\/div><\/section>\n      <\/div>\n      <section class=\"panel\"><h3>Amaliy topshiriq<\/h3><p>Mahalliy hududdagi ekotizimni tanlang (bog‘, daryo bo‘yi yoki dala). Undagi tirik organizmlar, suv, tuproq va havo o‘rtasidagi bog‘lanishni sxemada ko‘rsating.<\/p><\/section>\n      <section class=\"panel simulation\">\n        <h3>Interaktiv model: Ekotizimdagi o‘zaro bog‘liqlik<\/h3><p>O‘simlik, hayvon, suv va tuproq omillarini faollashtirib, ekotizim tarkibiy qismlari bir-biriga bog‘liqligini kuzating.<\/p>\n        \n        \n        \n        \n        \n        \n        \n        \n        \n        \n        \n        <div class=\"eco\"><button data-eco=\"plant\">O‘simlik<\/button><button data-eco=\"water\">Suv<\/button><button data-eco=\"animal\">Hayvon<\/button><button data-eco=\"soil\">Tuproq<\/button><\/div><p id=\"ecoout-53\">Ekotizim tarkibiy qismini tanlang.<\/p>\n      <\/section>\n      <section class=\"panel\"><h3>Mustahkamlash testi<\/h3><div class=\"quiz\" data-quiz='[{&quot;q&quot;: &quot;Tirik organizmlar tarqalgan Yer qobig‘i?&quot;, &quot;o&quot;: [&quot;Atmosfera&quot;, &quot;Biosfera&quot;, &quot;Litosfera&quot;, &quot;Stratosfera&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Organizmlar va yashash muhiti birligi?&quot;, &quot;o&quot;: [&quot;Masshtab&quot;, &quot;Ekotizim&quot;, &quot;Meridian&quot;, &quot;Barometr&quot;], &quot;a&quot;: 1}, {&quot;q&quot;: &quot;Biosferani asrashga qaysi ish yordam beradi?&quot;, &quot;o&quot;: [&quot;Chiqindini daryoga tashlash&quot;, &quot;Daraxtlarni asrash va chiqindini saralash&quot;, &quot;Suvni behuda oqizish&quot;, &quot;Yovvoyi hayvonlarni bezovta qilish&quot;], &quot;a&quot;: 1}]'><\/div><\/section>\n      <details class=\"teacher\"><summary>O‘qituvchi uchun tavsiya<\/summary><p>Darsni qisqa savol-javob bilan boshlang. Asosiy tushunchalarni xarita, chizma yoki kundalik hayotdan olingan misol bilan tushuntiring. Amaliy topshiriqni juftlikda bajartiring, so‘ng test natijalarini birgalikda muhokama qiling.<\/p><\/details>\n    <\/article>\n<footer class=\"foot\">O‘quv qo‘llanma sifatida tayyorlangan. Mavzular mazmuni maktab darsligi va o‘qituvchi rejasiga mos ravishda tekshirib, to‘ldirilishi mumkin.<\/footer>\n<\/main>\n<script>\ndocument.querySelectorAll('[data-target]').forEach(b=>b.addEventListener('click',()=>{document.getElementById(b.dataset.target).scrollIntoView({behavior:'smooth'});document.querySelectorAll('[data-target]').forEach(x=>x.classList.toggle('active',x===b))}));\ndocument.querySelectorAll('.quiz').forEach(box=>{\n const qs=JSON.parse(box.dataset.quiz);let score=0,done=0;\n qs.forEach((q,i)=>{const card=document.createElement('div');card.className='question';const p=document.createElement('p');p.textContent=(i+1)+'. '+q.q;card.appendChild(p);const opts=document.createElement('div');opts.className='answers';const fb=document.createElement('div');fb.className='feedback';\n q.o.forEach((o,j)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+o;b.addEventListener('click',()=>{if(card.dataset.done)return;card.dataset.done='1';done++;if(j===q.a){score++;b.classList.add('correct');fb.textContent='To‘g‘ri javob!'}else{b.classList.add('wrong');opts.children[q.a].classList.add('correct');fb.textContent='To‘g‘ri javob: '+q.o[q.a]}if(done===qs.length){const s=document.createElement('p');s.className='score';s.textContent='Natija: '+score+' / '+qs.length;box.appendChild(s)}});opts.appendChild(b)});card.appendChild(opts);card.appendChild(fb);box.appendChild(card)});\n const reset=document.createElement('button');reset.textContent='Testni qayta ishlash';reset.className='btn';reset.addEventListener('click',()=>{box.innerHTML='';box.dataset.quiz=JSON.stringify(qs);box.dispatchEvent(new Event('resetquiz'))});\n // Reset by reloading the page to guarantee a clean quiz state\n reset.addEventListener('click',()=>location.reload());box.appendChild(reset);\n});\nfunction val(id){return document.getElementById(id)}\n// Masshtab\n(function(){let n=42,a=val('mapdist-'+n),s=val('scale-'+n),o=val('out-'+n);function f(){o.textContent='Haqiqiy masofa: '+(Math.max(0,+a.value)*+s.value/100000).toLocaleString('uz-UZ')+' km'}a.addEventListener('input',f);s.addEventListener('change',f);f()})();\n// Koordinatalar\n(function(){let n=43,la=val('lat-'+43),lo=val('lon-'+43),o=val('coordout-'+43),dot=val('coordgrid-'+43).querySelector('i');function f(){o.textContent=Math.abs(la.value)+'° '+(la.value<0?'janubiy':'shimoliy')+' kenglik, '+Math.abs(lo.value)+'° '+(lo.value<0?'g‘arbiy':'sharqiy')+' uzunlik';dot.style.left=((+lo.value+180)/360*100)+'%';dot.style.top=((90-(+la.value))/180*100)+'%'}la.addEventListener('input',f);lo.addEventListener('input',f);f()})();\n// Balandlik\n(function(){let n=44,a=val('altA-44'),b=val('altB-44'),o=val('altout-44');function f(){o.textContent='Nisbiy balandlik: '+Math.abs(+a.value-(+b.value))+' m'}a.addEventListener('input',f);b.addEventListener('input',f);f()})();\n// Gorizontallar\n(function(){let n=45,r=val('slope-45'),o=val('slopeout-45'),svg=val('contour-45');function f(){let v=+r.value;o.textContent='Gorizontallar: '+(v>=7?'juda zich — tik yonbag‘ir':v>=4?'o‘rtacha zich':'siyrak — yotiq yonbag‘ir');svg.innerHTML='';for(let i=0;i<7;i++){let e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');e.setAttribute('cx','160');e.setAttribute('cy','75');e.setAttribute('rx',25+i*(v*2.1));e.setAttribute('ry',10+i*(v*.9));e.setAttribute('fill','none');e.setAttribute('stroke','#0b6e6a');e.setAttribute('stroke-width','2');svg.appendChild(e)}}r.addEventListener('input',f);f()})();\n// Plitalar\n(function(){let s=val('plate-46'),p=val('plates-46'),o=val('plateout-46');function f(){let v=s.value;p.children[1].textContent=v==='div'?'←   →':v==='conv'?'→   ←':'↑   ↓';o.textContent=v==='div'?'Plitalar bir-biridan uzoqlashadi.':v==='conv'?'Plitalar bir-biriga yaqinlashadi.':'Plitalar yonma-yon siljiydi.'}s.addEventListener('change',f);f()})();\n// Vaqt\n(function(){let t=val('time-47'),d=val('offset-47'),o=val('timeout-47');function f(){let [h,m]=t.value.split(':').map(Number);let total=(h*60+m+(+d.value)*60+1440*4)%1440;o.textContent='Yangi hudud vaqti: '+String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0')}t.addEventListener('input',f);d.addEventListener('input',f);f()})();\n// Atmosfera qatlamlari\ndocument.querySelectorAll('.layer').forEach(el=>el.addEventListener('click',()=>{const infos=['Eng quyi qatlam; ob-havo hodisalari asosan shu yerda sodir bo‘ladi.','Ozon qatlami joylashgan qatlam.','Ko‘plab meteorlar shu qatlamda yonib ketadi.','Qutb yog‘dusi kuzatilishi mumkin bo‘lgan yuqori qatlam.','Atmosferaning eng tashqi, siyrak qatlami.'];document.getElementById('layerinfo-49').textContent=el.textContent+': '+infos[+el.dataset.layer]}));\n// Bosim\n(function(){let h=val('height-50'),o=val('pressureout-50');function f(){let p=1013*Math.exp(-(+h.value)/8400);o.textContent='Taxminiy bosim: '+Math.round(p)+' hPa'}h.addEventListener('input',f);f()})();\n// Harorat\n(function(){let h=val('hour-51'),t=val('temp-51'),o=val('tempout-51'),fill=val('thermofill-51');function f(){o.textContent='Soat '+String(h.value).padStart(2,'0')+':00 · '+t.value+'°C';fill.style.width=((+t.value+10)/50*100)+'%'}h.addEventListener('input',f);t.addEventListener('input',f);f()})();\n// Amplituda\n(function(){let a=val('maxT-52'),b=val('minT-52'),o=val('ampout-52');function f(){o.textContent='Amplituda: '+Math.abs(+a.value-(+b.value))+'°C'}a.addEventListener('input',f);b.addEventListener('input',f);f()})();\n// Ekotizim\ndocument.querySelectorAll('[data-eco]').forEach(b=>b.addEventListener('click',()=>{const m={plant:'O‘simliklar quyosh energiyasidan foydalanib organik modda hosil qiladi.',water:'Suv barcha tirik organizmlar hayoti uchun zarur muhit va resursdir.',animal:'Hayvonlar oziq zanjirida iste’molchi sifatida qatnashadi.',soil:'Tuproq o‘simliklarni oziqa va tayanch bilan ta’minlaydi.'};document.getElementById('ecoout-53').textContent=m[b.dataset.eco]}));\n<\/script><\/body><\/html>\n",f3:"<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Geografiya — BSB (7-bob) va CHSB (8-bob)<\/title>\n<style>\n:root{--bg:#EDF1F2;--sf:#fff;--fg:#12262C;--mu:#51656B;--ln:#CBD6D9;--ac:
