*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
#home{max-width:1000px;margin:0 auto;padding:28px 18px 60px}

.tag{font-size:.75rem;color:var(--acc);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.t{margin-top:4px;font-weight:600;line-height:1.3}
#viewer{display:none;position:fixed;inset:0;flex-direction:column;background:var(--bg)}
#bar{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--card);border-bottom:1px solid var(--bd)}
#bar button{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer}
#bar button:hover{border-color:var(--acc)}
#bar button:disabled{opacity:.4;cursor:default}
#ttl{flex:1;min-width:0;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#frame{flex:1;width:100%;border:0;background:#fff}
</style>

function decode(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function open_(i){
  if(i<0||i>=flat.length)return;
  cur=i;const it=flat[i];
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(new Blob([decode(DATA[it.id])],{type:'text/html;charset=utf-8'}));
  $('frame').src=url;
  $('ttl').textContent=it.tag+' · '+it.title;
  $('prev').disabled=i===0;$('next').disabled=i===flat.length-1;
  $('home').style.display='none';$('viewer').style.display='flex';
  try{history.replaceState(null,'','#'+it.id)}catch(e){}
}
function home(){
  $('viewer').style.display='none';$('home').style.display='block';
  $('frame').src='about:blank';
  if(url){URL.revokeObjectURL(url);url=null}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
}
const list=$('list');
GROUPS.forEach(g=>{
  const h=document.createElement('h2');h.textContent=g.title;list.appendChild(h);
  const gr=document.createElement('div');gr.className='grid';
  g.items.forEach(it=>{
    const b=document.createElement('button');b.className='card';
    b.innerHTML='<div class="tag"></div><div class="t"></div>';
    b.firstChild.textContent=it.tag;b.lastChild.textContent=it.title;
    b.onclick=()=>open_(flat.indexOf(it));
    gr.appendChild(b);
  });
  list.appendChild(gr);
});
$('back').onclick=home;
$('prev').onclick=()=>open_(cur-1);
$('next').onclick=()=>open_(cur+1);
const h=location.hash.slice(1);const k=flat.findIndex(x=>x.id===h);if(k>=0)open_(k);
</script>
</body>
</html>
