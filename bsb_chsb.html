<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geografiya — BSB (7-bob) va CHSB (8-bob)</title>
<style>
:root{--bg:#EDF1F2;--sf:#fff;--fg:#12262C;--mu:#51656B;--ln:#CBD6D9;--ac:#0B6E6A;--ai:#fff;--soft:#D5EAE8;--ok:#0A6B3B}
@media (prefers-color-scheme:dark){:root{--bg:#0E1B1F;--sf:#15282D;--fg:#E6EEF0;--mu:#9BB0B5;--ln:#2B434A;--ac:#4FC3B8;--ai:#06211F;--soft:#193A3C;--ok:#6EDC9E;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.bar{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;align-items:center}
.bar .sp{flex:1}
button{font:inherit;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--fg);cursor:pointer;font-weight:600}
button[aria-selected=true],button.on{background:var(--ac);color:var(--ai);border-color:var(--ac)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.sheet{max-width:860px;margin:18px auto;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:28px 30px}
@media (max-width:600px){.sheet{margin:10px;padding:18px}}
h1{font-size:1.35rem;margin:0 0 4px;text-align:center}
.meta{text-align:center;color:var(--mu);font-size:.92rem;margin-bottom:14px}
.fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:16px}
.fields span{border-bottom:1.5px solid var(--mu);padding:2px 0;font-size:.9rem;color:var(--mu)}
@media (max-width:600px){.fields{grid-template-columns:1fr}}
h2{font-size:1.05rem;margin:22px 0 8px;padding:6px 10px;background:var(--soft);border-radius:8px;display:flex;justify-content:space-between;gap:8px}
.q{margin:0 0 14px;break-inside:avoid}
.q b{display:inline-block;min-width:1.7em}
.opts{list-style:none;margin:6px 0 0 1.7em;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
@media (max-width:600px){.opts{grid-template-columns:1fr}}
.pt{color:var(--mu);font-size:.85rem;white-space:nowrap}
.line{border-bottom:1px solid var(--ln);height:26px;margin-left:1.7em}
.ans{display:none;margin:6px 0 0 1.7em;padding:8px 12px;border-left:4px solid var(--ok);background:var(--soft);border-radius:0 8px 8px 0;font-size:.93rem}
body.key .ans{display:block}
body.key .opt.right{color:var(--ok);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:.92rem;margin-top:8px}
th,td{border:1px solid var(--ln);padding:6px 10px;text-align:left}
.tw{overflow-x:auto}
.hide{display:none}
@media print{
 body{background:#fff;color:#000}.bar{display:none}
 .sheet{border:0;margin:0;padding:0;max-width:none;background:#fff;color:#000}
 .sheet.hide{display:none}.sheet:not(.hide){display:block}
 h2{background:#eee}
}
</style>
</head>
<body>
<div class="bar" role="tablist" aria-label="Baholash turi">
 <button role="tab" id="t0" aria-selected="true">BSB · 7-bob</button>
 <button role="tab" id="t1" aria-selected="false">CHSB · 8-bob</button>
 <span class="sp"></span>
 <button id="key" aria-pressed="false">Javoblar kaliti</button>
 <button id="prn">Chop etish</button>
</div>
<main id="out"></main>
<script>
const D=[
{id:"s0",title:"BSB — 7-bob bo‘yicha summativ baholash",sub:"Geografik xaritalar, koordinatalar, relyef, litosfera plitalari, vaqt mintaqalari (41–47-mavzular)",
test:[
["Xaritadagi masofa bilan joydagi haqiqiy masofa nisbatini nima ko‘rsatadi?",["Legenda","Masshtab","Gorizontal","Meridian"],1],
["0° kenglik chizig‘i qanday ataladi?",["Bosh meridian","Qutb doirasi","Ekvator","Tropik"],2],
["Bir xil mutlaq balandlikdagi nuqtalarni birlashtiruvchi chiziqlar nima deyiladi?",["Gorizontallar","Izotermalar","Meridianlar","Parallellar"],0],
["Litosfera plitalari bir-biriga yaqinlashadigan chegara qanday ataladi?",["Divergent","Transform","Konvergent","Ekvatorial"],2],
["Geografik uzunlikning taxminan 15° farqi qancha vaqt farqiga mos keladi?",["10 daqiqa","1 soat","6 soat","24 soat"],1],
["Mutlaq balandlik nimaga nisbatan aniqlanadi?",["Eng yaqin tepalikka","Dengiz sathiga","Vodiy tubiga","Shahar markaziga"],1],
["Xaritada gorizontallar bir-biriga juda yaqin joylashgan bo‘lsa, yonbag‘ir qanday bo‘ladi?",["Yotiq","Tekis","Tik","Botiq"],2],
["Bosh meridian qaysi joy orqali o‘tadi?",["Grinvich","Toshkent","Nyu-York","Pekin"],0]],
short:[
["1:200 000 masshtabli xaritada ikki qishloq orasidagi masofa 4 sm. Haqiqiy masofani km da hisoblang.","4 × 200 000 = 800 000 sm = 8 km."],
["A nuqta 250 m, B nuqta 430 m balandlikda. Nisbiy balandlikni toping.","430 − 250 = 180 m."],
["Boshlang‘ich hududda vaqt 14:00. Sharq tomondagi hudud bilan farq +3 soat. Ikkinchi hudud vaqtini aniqlang.","14:00 + 3 soat = 17:00."]],
open:[
["Masshtabning uch turini sanang va har biriga bittadan misol keltiring.","Sonli (1:100 000), nomli (1 sm da 2 km), chiziqli (bo‘linmali chiziq). Har bir tur — 0,5 ball, har bir misol — 0,5 ball."],
["Litosfera plitalari chegaralarining uch turini ta’riflang va ularni zilzila hamda vulqonlar tarqalishi bilan bog‘lang.","Divergent (uzoqlashish), konvergent (yaqinlashish), transform (yonma-yon siljish) — 1,5 ball. Chegaralar yaqinida zilzila va vulqonlar ko‘p uchrashi (masalan, Tinch okeani atrofi) — 1,5 ball."]]},
{id:"s1",title:"CHSB — 8-bob bo‘yicha chorak summativ baholash",sub:"Gidrosfera, atmosfera, havo bosimi va harorati, biosfera (48–53-mavzular)",
test:[
["Gidrosfera nima?",["Yerning gaz qobig‘i","Yerning suv qobig‘i","Yerning tosh qobig‘i","Tirik organizmlar qobig‘i"],1],
["Suv aylanishining to‘g‘ri ketma-ketligini tanlang.",["Yog‘in → bug‘lanish → bulut","Bulut → yog‘in → bug‘lanish","Bug‘lanish → kondensatsiya → yog‘in","Yog‘in → bulut → bug‘lanish"],2],
["Ob-havo hodisalari asosan qaysi qatlamda kechadi?",["Troposfera","Stratosfera","Mezosfera","Termosfera"],0],
["Ozon qatlami atmosferaning qaysi qatlamida joylashgan?",["Troposfera","Mezosfera","Stratosfera","Ekzosfera"],2],
["Barometr nimani o‘lchaydi?",["Haroratni","Namlikni","Havo bosimini","Shamol tezligini"],2],
["Balandlik oshgan sari havo bosimi odatda qanday o‘zgaradi?",["Ortadi","Kamayadi","O‘zgarmaydi","Avval ortib, keyin yo‘qoladi"],1],
["Xaritada bir xil haroratli nuqtalarni birlashtiruvchi chiziq nima deyiladi?",["Gorizontal","Izobara","Izoterma","Meridian"],2],
["Biosfera nima?",["Tirik organizmlar tarqalgan Yer qobig‘i","Faqat okeanlar majmui","Atmosferaning yuqori qatlami","Yer mantiyasi"],0]],
short:[
["Bir sutkada maksimal harorat +18°C, minimal +7°C. Sutkalik amplitudani hisoblang.","18 − 7 = 11°C."],
["Iyul oyining o‘rtacha harorati +30°C, yanvarniki −2°C. Yillik amplitudani toping.","30 − (−2) = 32°C."],
["Atmosfera qatlamlarini pastdan yuqoriga ketma-ket yozing.","Troposfera, stratosfera, mezosfera, termosfera, ekzosfera."]],
open:[
["Gidrosferaning tarkibiy qismlarini sanang va suv aylanishi bosqichlarini tushuntiring.","Okean va dengizlar, daryo va ko‘llar, muzliklar, yerosti suvlari, atmosfera namligi — 1,5 ball. Bug‘lanish → kondensatsiya (bulut) → yog‘in → oqim va yerosti suvlari → okean — 1,5 ball."],
["Biosfera tabiiy qobiqlar bilan qanday bog‘langanini tushuntiring. Insonning biosferaga ta’siriga va uni muhofaza qilishga ikkitadan misol keltiring.","Biosfera atmosfera, gidrosfera va litosferaning hayot bor qismlarini qamrab oladi — 1 ball. Ta’sirga ikki misol (masalan, o‘rmonlarning kesilishi, suvning ifloslanishi) — 1 ball. Muhofazaga ikki misol (masalan, daraxt ekish, qo‘riqxonalar) — 1 ball."]]}
];
const L="ABCD",out=document.getElementById("out");
D.forEach((d,i)=>{
 let n=0,h=`<section class="sheet${i?" hide":""}" id="${d.id}"><h1>${d.title}</h1><div class="meta">${d.sub}<br>Geografiya · 6-sinf · Jami: 20 ball · Vaqt: 40 daqiqa</div>
 <div class="fields"><span>F.I.Sh.:</span><span>Sinf:</span><span>Sana:</span></div>
 <h2><span>I. Test savollari</span><span class="pt">8 × 1 = 8 ball</span></h2>`;
 d.test.forEach(([q,o,a])=>{n++;h+=`<div class="q"><b>${n}.</b>${q}<ul class="opts">${o.map((t,k)=>`<li class="opt${k==a?" right":""}">${L[k]}) ${t}</li>`).join("")}</ul><div class="ans">Javob: ${L[a]}</div></div>`});
 h+=`<h2><span>II. Qisqa javobli topshiriqlar</span><span class="pt">3 × 2 = 6 ball</span></h2>`;
 d.short.forEach(([q,a])=>{n++;h+=`<div class="q"><b>${n}.</b>${q}<div class="line"></div><div class="line"></div><div class="ans">${a}</div></div>`});
 h+=`<h2><span>III. Ochiq topshiriqlar</span><span class="pt">2 × 3 = 6 ball</span></h2>`;
 d.open.forEach(([q,a])=>{n++;h+=`<div class="q"><b>${n}.</b>${q}${'<div class="line"></div>'.repeat(4)}<div class="ans">${a}</div></div>`});
 h+=`<h2><span>Baholash mezoni (taxminiy)</span></h2><div class="tw"><table><tr><th>Ball</th><th>18–20</th><th>14–17</th><th>10–13</th><th>0–9</th></tr><tr><th>Baho</th><td>5</td><td>4</td><td>3</td><td>2</td></tr></table></div></section>`;
 out.insertAdjacentHTML("beforeend",h);
});
const tabs=[t0,t1];
function show(i){tabs.forEach((t,k)=>{t.setAttribute("aria-selected",k==i);document.getElementById(D[k].id).classList.toggle("hide",k!=i)});scrollTo(0,0)}
tabs.forEach((t,i)=>t.onclick=()=>show(i));
key.onclick=()=>{const o=document.body.classList.toggle("key");key.setAttribute("aria-pressed",o);key.classList.toggle("on",o)};
prn.onclick=()=>print();
</script>
</body>
</html>
